// --- 階確定イベント ---
// 特定の階で必ず発生するイベント。通常イベント抽選より優先される。
// 各イベントは { floor: 出現階, isAvailable: 出現可能か, fn: 発動処理 } で定義。
// isAvailable() が false ならその階の通常イベント抽選が走る（同階では再抽選しない）。
// 階確定イベント定義
// floor は数値 or 関数。関数の場合は実行時に対象階を返す（採掘便りの墓イベントなど動的なものに対応）
const FIXED_FLOOR_EVENTS = [
  {
    id: "youki",
    floor: 95,
    // 出現条件：累計で一度も助けていない（=紋未解放）かつ、このランでもまだ遭遇していない
    isAvailable: () => state.stats.youki === 0 && state.runStats.youki === 0,
    fn: () => {
      playSE("select");
      state.mode = "event_youki";
      addLog("派手な金髪の青年が話しかけてきた…");
    },
  },
  {
    id: "grave",
    // floor を関数化：現在の採掘便り（currentLetter）の階を返す。便りが無ければ -1（決して一致しない）
    floor: () => {
      try {
        const raw = localStorage.getItem("currentLetter");
        if(!raw) return -1;
        const letter = JSON.parse(raw);
        return (letter && typeof letter.floor === "number") ? letter.floor : -1;
      } catch(e){ return -1; }
    },
    // 出現条件：採掘便りに墓データがあり、まだ回収していない
    isAvailable: () => {
      const raw = localStorage.getItem("currentLetter");
      if(!raw) return false;
      const collected = localStorage.getItem("currentLetterCollected") === "1";
      return !collected;
    },
    fn: () => {
      playSE("select");
      state.mode = "event_grave";
      addLog("誰かが倒れた形跡がある…");
      // 詳細表示は render() 側で event_grave モード用のメッセージを組み立てる
    },
  },
];

// --- 探索 ---
function next(){
  state.floor++;
  state.runStats.floors++;
  if(state.floor > state.maxFloorThisRun) state.maxFloorThisRun = state.floor;

  // 毒中間モード用フラグをクリア
  state.poisonTickedThisTurn = false;

  // バフ・デバフのターン処理（階層上昇時）
  tickBuffs();
  if(state.hp <= 0){ checkDeath(); render(); return; }

  // 毒ダメージが発生した場合は中間モードへ。プレイヤーが「進む」ボタンを押すまで
  // 次のイベント抽選・特殊階判定を行わない。
  if(state.poisonTickedThisTurn){
    state.mode = "poison_tick";
    render();
    return;
  }

  proceedAfterTick();
}

// next() のうち、tickBuffs後のイベント抽選〜特殊階判定部分。
// 毒ダメージ後の中間モードからも呼ばれる。
function proceedAfterTick(){
  // mode は "poison_tick" から呼ばれる可能性があるため、必ず通常モードに戻しておく。
  // 各イベントが必要に応じて event_* モードに切り替える。
  state.mode = "explore";

  // 紋獲得イベント：15階 または 51,101,151...階
  let isRelicFloor = state.floor === 15 || (state.floor > 1 && (state.floor - 1) % 50 === 0);
  if(isRelicFloor && !state.relicEventFloors.has(state.floor)){
    state.relicEventFloors.add(state.floor);
    let pool = CREST_MASTER.filter(c =>
      UNLOCKED_CRESTS.has(c.id) &&
      !state.relics.some(r => r.id === c.id)
    );
    if(pool.length > 0){
      let shuffled = [...pool].sort(() => Math.random() - 0.5);
      state.relicChoices = shuffled.slice(0, 3);
      state.mode = "event_relic_pick";
      let msg = state.floor === 15
        ? "採掘者よ…紋を纏い奈落を目指せ"
        : "紋を発見した！";
      addLog(msg);
      render();
      return;
    }
  }

  if(state.floor % 30 === 0){
    if(state.goddessUsedFloors.has(state.floor)){
      addLog(`－－－ ${state.floor}階層 －－－\n女神は沈黙している…`, "divider");
      state.mode = "explore";
      render();
      return;
    }
    addLog(`－－－ ${state.floor}階層 －－－\n女神像がある…お布施をすればご利益があるかも`, "divider");
    state.mode = "event_goddess";
    render();
    return;
  }

  if(state.floor % 10 === 0){
    addLog(`－－－ ${state.floor}階層 －－－\nスクラップを半分支払えば帰還できそうだ`, "divider");
    state.mode = "return";
    render();
    return;
  }

  // 階確定イベント（鉄扉・女神像の特殊階の後、通常イベント抽選の前）
  for(const fe of FIXED_FLOOR_EVENTS){
    // floor は数値 or 関数。関数なら呼び出して階を取得
    const targetFloor = (typeof fe.floor === "function") ? fe.floor() : fe.floor;
    if(targetFloor === state.floor && fe.isAvailable()){
      fe.fn();
      render();
      return;
    }
  }

  // --- 軽(70%) / 重(30%) の2段階抽選 ---
  // イベント比率定数（紋や仕様変更で調整可能）
  const hasDetect = state.relics.some(r => r.id === "detect");
  const RATE_MINING = hasDetect ? 0.30 : 0.40;
  const RATE_LIGHT  = hasDetect ? 0.20 : 0.30;
  const RATE_HEAVY  = hasDetect ? 0.50 : 0.30;

  const roll = Math.random();
  const ctx  = buildEventCtx();

  if(roll < RATE_MINING){
    // 採掘イベント（固定）
    (() => {
      let g = Math.floor(calcScrap() * getMiningMultiplier());
      // 初心の紋：+1固定加算
      if(state.relics.some(r => r.id === "beginner")) g += 1;
      // 採掘の紋：1.1倍（切り上げ）
      if(state.relics.some(r => r.id === "mining")){
        g = Math.ceil(g * 1.1);
      }
      // 低HP（25%以下）時：15%の確率で採掘ペナルティ（スクラップ30%減）
      let lowHpPenalty = EVENT_COND().lowHp && Math.random() < 0.15;
      if(lowHpPenalty){
        let penalty = Math.floor(g * 0.3);
        g -= penalty;
      }
      gainScrap(g);
      // エメラルドドロップ判定
      let dropRate = getEmeraldDropRate();
      if(dropRate > 0 && Math.random() < dropRate){
        gainEmerald(1);
        playSE("emerald");
        addLog(`採掘した スクラップ +${g.toLocaleString()} エメラルド +1`, "scrap");
      } else {
        playSE("dig");
        addLog(`採掘した スクラップ +${g.toLocaleString()}`, "scrap");
      }
      if(lowHpPenalty){
        addLog(`疲れて採掘が捗らない…`, "sub");
      }
      // 高HP（75%以上）時：15%の確率で採掘ボーナス
      if(EVENT_COND().highHp && Math.random() < 0.15){
        let bonus = Math.max(1, Math.floor(g * 0.3));
        gainScrap(bonus);
        addLog(`採掘の調子が良い！追加 スクラップ +${bonus.toLocaleString()}`, "sub");
      }
    })();
    checkDeath();
    render();
  } else if(roll < RATE_MINING + RATE_LIGHT){
    // 軽イベント抽選
    let ev = pickWeightedEvent(LIGHT_EVENTS, ctx);
    ev.fn();
    checkDeath();
    render();
  } else {
    // 重イベント抽選
    let ev = pickWeightedEvent(HEAVY_EVENTS, ctx);
    ev.fn();
    if(state.mode !== "explore"){ render(); return; }
    checkDeath();
    render();
  }
}

// --- コンテナ ---
function openChest(){
  state.runStats.chests++;
  let r = Math.random();
  if(r < 0.60){
    // スクラップ 60%
    let g = calcScrap() * 3;
    gainScrap(g);
    addLog(`資源を発見！ スクラップ +${g.toLocaleString()}`, "sub");
    checkDeath();
    if(state.mode !== "dead") state.mode = "explore";
  } else if(r < 0.70){
    // ポーション 10%
    let newItem = { name: "ポーション", effect: "hp3" };
    if(state.items.length < 5){
      state.items.push(newItem);
      saveAll();
      addLog("ポーションを発見！", "sub");
      state.mode = "explore";
    } else {
      state.pendingItem = newItem;
      addLog("ポーションを発見！ でも手持ちがいっぱいだ…", "sub");
      state.mode = "event_item_full";
    }
  } else if(r < 0.85){
    // 空っぽ 15%
    addLog("空っぽだった…", "sub");
    state.mode = "explore";
  } else {
    // 罠 15%
    let d = Math.ceil(state.maxHp * 0.2);
    let actual = damage(d);
    playSE("damage");
    addLog(`罠だった！ ${actual} ダメージ`, "sub");
    checkDeath();
    if(state.mode !== "dead") state.mode = "explore";
  }
  render();
}

// --- 手持ちいっぱい：アイテム選択破棄 ---
function renderItemFullEvent(){
  let a = document.getElementById("actions");
  let allItems = [...state.items, state.pendingItem]; // 手持ち5個＋新規1個

  let label = document.createElement("div");
  label.style.cssText = "color:#aaa;font-size:22px;margin:4px 8px;width:100%;text-align:center;";
  label.innerText = "持ち物がいっぱい！ 使うか、捨てるアイテムを選んでください";
  a.appendChild(label);

  // 一旦コンテナを作り、共通関数のHTML文字列をまとめて挿入
  let container = document.createElement("div");
  container.style.cssText = "width:100%;";
  let html = "";
  allItems.forEach((item, i) => {
    const isNew = (i === allItems.length - 1);
    // 採掘中限定で出るイベントなので「使う」は基本可能（個別のusableModesは見る）
    const def = item ? ITEM_DEF[item.effect] : null;
    const modeUsable = !def || !def.usableModes || def.usableModes.includes("event_item_full") || def.usableModes.includes("explore");
    html += buildItemRowHTML(item, i, {
      showNumber: false,
      useEnabled: modeUsable,
      useHandler: `useFromFull(${i})`,
      discardEnabled: true,
      discardHandler: `dropAndKeep(${i})`,
      newBadge: isNew,
    });
  });
  container.innerHTML = html;
  a.appendChild(container);
}

// 満タン時に「使う」を押したときの処理
//  - 既存スロットのアイテムを使う → そこに空きができる → pendingItem を空きへ入れる
//  - 新規アイテム(pendingItem)自身を使う → 持ち物は5個のまま、pendingItemを消費
function useFromFull(index){
  const allItems = [...state.items, state.pendingItem];
  const target = allItems[index];
  if(!target) return;

  const isNew = (index === allItems.length - 1);

  // 効果を発動（既存の useItem の中身に相当する処理を直接呼ぶ）
  applyItemEffect(target);

  if(isNew){
    // 新規アイテムを直接使った：pendingItem を消費して終了
    state.pendingItem = null;
  } else {
    // 既存スロットを消費 → そこに pendingItem を入れる
    state.items.splice(index, 1);
    state.items.push(state.pendingItem);
    state.pendingItem = null;
  }
  saveAll();
  state.mode = "explore";
  render();
}

// 既存のアイテム効果発動ロジックを切り出した関数
// （useItem からも useFromFull からも使えるようにする）
function applyItemEffect(item){
  const def = ITEM_DEF[item.effect];
  if(!def) return;
  if(item.effect === "hp3"){
    let v = getPotionHealValue();
    if(state.relics.some(r => r.id === "potion_boost")){
      v = Math.ceil(v * 1.1);
    }
    heal(v);
    playSE("heal");
    state.runStats.potions++;
    addLog(`ポーションを使った！ HP +${v}`, "scrap");
  } else if(item.effect === "antidote"){
    let idx = state.buffs.findIndex(b => b.id === "poison");
    if(idx >= 0){
      state.buffs.splice(idx, 1);
      playSE("heal");
      addLog("毒消し草を使った！ 毒が治った", "heal");
    } else {
      addLog("毒消し草を使った（毒状態ではなかった）", "normal");
    }
  } else if(item.effect === "guard3"){
    applyBuffById("guard", 3);
    playSE("select");
    addLog("ヘルメットを装着！ 🛡️ ガード +3回", "sub");
  } else if(item.effect === "beyaku"){
    // ベーヤク = 採掘力UP 10T + 脆弱 10T
    // 強力なバフだが代償としてダメージ増幅デバフが付く両刃の薬。
    // ログは3行構成：見出し + 各効果（subで）
    applyBuffById("miningUp", 10);
    applyBuffById("fragile", 10);
    playSE("select");
    state.runStats.beyaku++;
    addLog("ベーヤクを使った！", "scrap");
    addLog("採掘力UP！（10ターン）", "sub");
    addLog("脆弱（10ターン）", "sub");
  }
}

function dropAndKeep(dropIndex){
  // 引数 allItems を取らない形に変更（呼び出し側がHTML属性経由で渡せないため）
  const allItems = [...state.items, state.pendingItem];
  // 捨てたアイテムを除いた5個を装備
  let kept = allItems.filter((_, i) => i !== dropIndex);
  state.items = kept;
  state.pendingItem = null;
  saveAll();
  let dropped = allItems[dropIndex];
  addLog(`${dropped.name} を捨てた`, "sub");
  state.mode = "explore";
  render();
}

// --- コウモリイベント ---
function calcBatLost(){
  if(state.scrap <= 0) return 0;
  let cap = calcScrap() * 3;
  return Math.min(cap, Math.max(1, Math.floor(state.scrap * 0.1)));
}

function renderBatEvent(){
  let a = document.getElementById("actions");
  let lost = calcBatLost();

  // 「音を立てる」ボタン
  let distractBtn = document.createElement("button");
  distractBtn.innerHTML = `音を立てる<br><span style="font-size:22px;color:#ffcc66;">${SVG_ICONS.scrap}-${lost.toLocaleString()}</span>`;
  let riskS = BTN_STYLES.risk;
  let skipS = BTN_STYLES.skip;
  if(state.scrap <= 0){
    distractBtn.style.borderColor = skipS.color;
    distractBtn.style.color       = skipS.color;
    distractBtn.style.background  = skipS.bg;
    distractBtn.disabled = true;
    distractBtn.style.opacity = "0.4";
  } else {
    distractBtn.style.borderColor = riskS.color;
    distractBtn.style.color       = riskS.color;
    distractBtn.style.background  = riskS.bg;
    distractBtn.style.boxShadow   = `0 0 10px ${riskS.color}66`;
    distractBtn.onclick = batDistract;
  }
  a.appendChild(distractBtn);

  // 「無理やり通る」ボタン（danger）
  let forceBtn = document.createElement("button");
  forceBtn.innerText = "無理やり通る";
  let dangerS = BTN_STYLES.danger;
  forceBtn.style.borderColor = dangerS.color;
  forceBtn.style.color       = dangerS.color;
  forceBtn.style.background  = dangerS.bg;
  forceBtn.style.boxShadow   = `0 0 10px ${dangerS.color}66`;
  forceBtn.onclick = batForce;
  a.appendChild(forceBtn);
}

function batDistract(){
  let lost = calcBatLost();
  state.scrap = Math.max(0, state.scrap - lost);
  state.runStats.batScrap += lost;
  addLog(`スクラップ ${lost.toLocaleString()} を投げて気をそらした`, "sub");
  state.mode = "explore";
  render();
}

function batForce(){
  if(Math.random() < 0.40){
    addLog("うまく切り抜けられた！", "sub");
  } else {
    let d = Math.ceil(state.maxHp * 0.1);
    let actual = damage(d);
    playSE("damage");
    applyPoison(4);
    addLog(`気づかれた！ ${actual} ダメージ`, "sub");
    addLog(`毒を受けた（4ターン）`, "sub");
  }
  checkDeath();
  if(state.mode !== "dead") state.mode = "explore";
  render();
}

// --- 紋フキダシトグル ---
// index は紋スロット内のインデックス。紋入れ替え（event_relic_swap）中は
// この index を state.selectedSwapIndex に反映し、入れ替え対象を選択する。
// 通常時（探索中など）は index は選択処理では使わないが、フキダシの位置計算
// （タップした紋スロットの真上に表示）に常時使う。
function toggleCrestTooltip(id, index){
  state.activeCrestId = state.activeCrestId === id ? null : id;
  // 紋入れ替えモード時は選択中スロットも更新（フキダシ閉じる時は null に戻す）
  if(state.mode === "event_relic_swap"){
    state.selectedSwapIndex = state.activeCrestId ? index : null;
  }
  // 先に再描画して紋スロットの位置を確定させる（持ち上がりなどの transform が反映された後で位置計算する）
  render();

  let tooltipEl = document.getElementById("crest-tooltip");
  if(state.activeCrestId){
    let c = CREST_MASTER.find(m => m.id === state.activeCrestId);
    if(c && tooltipEl){
      // フキダシ本体（クラスベース。色は CSS変数 --tooltip-color で渡す）
      tooltipEl.innerHTML = `<div class="crest-tooltip-box" style="--tooltip-color:${c.color};box-shadow:0 0 16px rgba(${c.rgb},0.5);">${c.desc}</div>`;
      tooltipEl.style.display = "block";
      // 位置計算：タップした紋カードの真上にフキダシを配置。
      // .crest-slots-wrap の index 番目の子要素を取得。
      // ロック中スロット（🔒）も子要素数にカウントされるので、index でそのまま参照可能。
      let wrapEl = document.querySelector(".crest-slots-wrap");
      let slotEl = wrapEl ? wrapEl.children[index] : null;
      if(slotEl){
        const cardRect = slotEl.getBoundingClientRect();
        const cardCenterX = cardRect.left + cardRect.width / 2;
        // フキダシ実寸を取得するため、一旦画面外に置いた上で寸法を取る
        tooltipEl.style.left = "-9999px";
        tooltipEl.style.top  = "0px";
        const tipRect = tooltipEl.getBoundingClientRect();
        const tipW = tipRect.width;
        const tipH = tipRect.height;
        // 横位置：紋カード中心を基準にフキダシ中央を合わせる。
        // 画面端で見切れないよう 8px マージンで clamp。
        const margin = 8;
        let leftPx = cardCenterX - tipW / 2;
        leftPx = Math.max(margin, Math.min(window.innerWidth - tipW - margin, leftPx));
        // 縦位置：紋カード上端の少し上（矢印分の余白12pxを取る）。
        const arrowGap = 12;
        const topPx = cardRect.top - tipH - arrowGap;
        tooltipEl.style.left = leftPx + "px";
        tooltipEl.style.top  = topPx + "px";
        // 矢印の横位置：紋カード中心 X からフキダシ左端 X を引いた相対座標。
        // CSS変数 --arrow-x で疑似要素の left に渡す。
        const arrowX = cardCenterX - leftPx;
        const box = tooltipEl.querySelector(".crest-tooltip-box");
        if(box){
          box.style.setProperty("--arrow-x", arrowX + "px");
        }
      }
    }
  } else {
    if(tooltipEl) tooltipEl.style.display = "none";
  }
}

// --- 紋獲得イベント ---
// 紋カード自体をタップで選択する形式。
// メイン画面側のカードに onclick を仕込んでおり、ここでは「どれも選ばない」ボタンだけ表示する。
function renderRelicPickEvent(){
  let a = document.getElementById("actions");
  a.style.flexWrap = "wrap";

  let skipRow = document.createElement("div");
  skipRow.style.cssText = "display:flex;justify-content:center;width:100%;margin-top:8px;";
  let skipBtn = document.createElement("button");
  skipBtn.innerText = "どれも選ばない";
  skipBtn.style.cssText = "border-color:#888;color:#888;background:rgba(136,136,136,0.1);min-width:180px;max-width:260px;";
  skipBtn.onclick = confirmSkipRelic;
  skipRow.appendChild(skipBtn);
  a.appendChild(skipRow);
}

// 紋カードのonclickから呼ぶヘルパー。
// onclick属性に直接オブジェクトは渡せないので、idで参照してpickRelicに渡す。
function pickRelicById(id){
  const crest = state.relicChoices.find(c => c.id === id);
  if(crest) pickRelic(crest);
}

function pickRelic(crest){
  if(state.relics.length < getRelicSlotCount()){
    state.relics.push(crest);
    addLog(`『${crest.name}』を装備した`, "sub");
    state.relicChoices = [];
    state.mode = "explore";
    render();
  } else {
    // スロット満タン → 入れ替え選択モードへ
    state.pendingRelic = crest;
    state.relicChoices = [];
    state.mode = "event_relic_swap";
    render();
  }
}

function confirmSkipRelic(){
  showConfirm("紋を選ばず進みますがよろしいですか？", () => {
    skipRelic();
  });
}

function skipRelic(){
  addLog("紋を見送った", "sub");
  state.relicChoices = [];
  state.mode = "explore";
  render();
}

// 紋選択画面の描画。render() から呼び出される。

      <div style="color:${c.color};font-size:16px;font-weight:bold;text-align:center;word-break:break-all;line-height:1.3;">${c.name}</div>

// 紋入れ替えイベント（event_relic_swap）のメイン画面描画。
// 上部に新規紋1枚を表示し、下部に「⬇ 入れ替える紋をスロットからタップ」の誘導文。
// 装備中5枚は再描画せず、既存の紋スロットをタップ式選択UIとして再利用する

// 人物系イベント（DAIGO・縦穴ジャンプ・商人・墓・陽キャなど）の共通描画ヘルパー。
// タイトル + 本文（複数行可）+ 補足 + 追加要素の構造を1関数で組み立てる。
// 本文の行間：1行目だけタイトルとの間に margin-top:6px、2行目以降は詰める（行間なし）。
// 引数:
//   ce      : current-event要素
//   ceText  : テキスト領域
//   ceIcon  : アイコン領域
//   opts    : { icon, title, titleColor, body, sub, extras }
//     - icon       : アイコンHTML（絵文字 or SVG文字列、SVGは2em化済みのものを渡す）
//     - title      : タイトル文字列
//     - titleColor : タイトル文字色（省略時 "#fff"）
//     - body       : 本文（string または string[]）
//     - sub        : 補足行（省略可、20px・グレー）
//     - extras     : 追加要素HTML（省略可、DAIGOの友誼回復メッセージ等）
function renderPersonEvent(ce, ceText, ceIcon, opts){
  ceIcon.innerHTML = opts.icon || "";

  let titleColor = opts.titleColor || "#fff";
  let titleHTML = `<div style="font-size:26px;color:${titleColor};">${opts.title}</div>`;

  // 本文を配列化（複数行と単一文字列の両対応）
  let bodyArr = Array.isArray(opts.body) ? opts.body : (opts.body ? [opts.body] : []);
  let bodyHTML = bodyArr.map((line, i) => {
    // 1行目だけタイトルとの間に隙間、2行目以降は詰める
    let mt = i === 0 ? "margin-top:6px;" : "";
    return `<div style="font-size:22px;color:#fff;${mt}">${line}</div>`;
  }).join("");

  let subHTML = opts.sub
    ? `<div style="font-size:20px;color:#aaa;margin-top:4px;">${opts.sub}</div>`
    : "";

  let extrasHTML = opts.extras || "";

  ceText.innerHTML = floorBadgeHTML(state.floor) + titleHTML + bodyHTML + subHTML + extrasHTML;
}

  let emeraldNote = state.veinLastEmerald
    ? ` <span style="color:#58d68d;">${SVG_ICONS.emerald}+1</span>`
    : "";

    `<div><span style="color:#ffcc66;">崩落確率：</span><span style="color:#f55;font-weight:bold;">${displayCollapse*100}%</span>${skilldigNote ? " " + skilldigNote : ""}</div>` +
    `<div><span style="color:#ffcc66;">想定ダメージ：</span><span style="color:#f55;font-weight:bold;">${dmgDisplay}</span></div>` +
    `<div><span style="color:#ffcc66;">獲得倍率：</span><span style="color:#58d68d;font-weight:bold;">×${p.mult}</span></div>` +

// --- 商人イベント ---
// 商人解禁段階（永続累計stats.merchantBuysから判定）
// 段階1: 0-9回 → ポーションのみ
// 段階2: 10-19回 → ポーション+毒消し草
// 段階3: 20回以上 → ポーション+毒消し草+ベーヤク
function getMerchantTier(){
  const c = state.stats.merchantBuys || 0;
  if(c >= 20) return 3;
  if(c >= 10) return 2;
  return 1;
}

// 商人の取扱商品（id→ポーション/毒消し草/ベーヤク）の価格を計算
// 「割合価格と最低値で高い方をとる」方式
//   - ポーション：20% / 最低10
//   - 毒消し草 ：30% / 最低100
//   - ベーヤク ：40% / 最低1000
function getMerchantPrice(itemId){
  const rate = { hp3: 0.2, antidote: 0.3, beyaku: 0.4 }[itemId];
  const min  = { hp3: 10,  antidote: 100, beyaku: 1000 }[itemId];
  const ratePrice = Math.floor(state.scrap * rate);
  return Math.max(min, ratePrice);
}

function renderMerchantEvent(){
  const tier = getMerchantTier();
  // 取扱リスト（段階ごと）
  const lineup = [
    { id: "hp3",      name: "ポーション" }
  ];
  if(tier >= 2) lineup.push({ id: "antidote", name: "毒消し草" });
  if(tier >= 3) lineup.push({ id: "beyaku",   name: "ベーヤク" });

  // 各商品ボタンを追加
  for(const it of lineup){
    const price = getMerchantPrice(it.id);
    const itemId = it.id;  // クロージャ用に固定
    btnWithPrice({
      label: it.name,
      price: price,
      canPay: state.scrap >= price && state.items.length < 5,
      payStyle: "risk",
      onClick: () => buyFromMerchant(itemId, price),
      seName: "coin",
    });
  }
  btn("いらない", ignoreMerchant, "skip");
}

function buyFromMerchant(itemId, price){
  state.scrap -= price;
  state.runStats.merchantBuys++;
  // アイテム名を ITEM_DEF から引いて確実に同期させる
  const def = ITEM_DEF[itemId];
  const newItem = { name: def ? def.name : "?", effect: itemId };
  if(state.items.length < 5){
    state.items.push(newItem);
    saveAll();
    addLog(`${newItem.name}を ${price.toLocaleString()} で購入した`, "sub");
  }
  state.mode = "explore";
  render();
}

  addLog("商人と別れた", "sub");
  state.mode = "explore";
  render();
}

// ============================================
// 採掘便りの墓イベント
// ============================================
// 採掘便りに表示されている墓データの指定階に到達すると発動。
// アイテム報酬 or スクラップ報酬（1%）。アイテム報酬時に持ち物満タンならコンテナと同じ満タン処理へ。
function pickupGrave(){
  const raw = localStorage.getItem("currentLetter");
  if(!raw){
    // 想定外ケース：墓データが消えてしまっている。何もせず次へ進む
    addLog("…何もなかった", "sub", SVG_ICONS.grave);
    state.mode = "explore";
    render();
    return;
  }
  let letter;
  try { letter = JSON.parse(raw); }
  catch(e){
    addLog("…何もなかった", "sub", SVG_ICONS.grave);
    state.mode = "explore";
    render();
    return;
  }

  // アイテム報酬 or スクラップ報酬の振り分け
  // 既知のアイテムeffectで、ITEM_DEFに存在するもの → アイテム報酬
  // それ以外（null・未知のeffect） → 故人の所持スクラップ1%が代替報酬
  if(letter.item && ITEM_DEF[letter.item]){
    const def = ITEM_DEF[letter.item];
    const newItem = { name: def.name, effect: letter.item };

    if(state.items.length >= 5){
      // 持ち物満タン：コンテナと同じ満タン処理画面へ
      state.pendingItem = newItem;
      state.mode = "event_item_full";
      addLog(`${def.name} を見つけた！ …が、持ち物がいっぱいだ`, "scrap", SVG_ICONS.grave);
      markGraveCollected();
      render();
      return;
    }
    // 空きあり：そのまま入手
    state.items.push(newItem);
    playSE("coin");
    addLog(`${def.name} を手に入れた！`, "scrap", SVG_ICONS.grave);
  } else {
    // スクラップ報酬（故人の所持スクラップ1%）
    const scrapDrop = Math.floor((letter.scrap || 0) * 0.01);
    if(scrapDrop > 0){
      gainScrap(scrapDrop);
      playSE("coin");
      addLog(`スクラップ ${scrapDrop} を手に入れた！`, "scrap", SVG_ICONS.grave);
    } else {
      // 故人がスクラップも所持してなかった超レアケース
      addLog("…めぼしいものはなかった", "sub", SVG_ICONS.grave);
    }
  }

  markGraveCollected();
  state.mode = "explore";
  render();
}

// --- 鉱脈イベント ---
const VEIN_PARAMS = [
  { collapse:0.20, mult:1.5, dmgCoef:1  },
  { collapse:0.40, mult:2.5, dmgCoef:2  },
  { collapse:0.60, mult:4.0, dmgCoef:4  },
  { collapse:0.80, mult:6.0, dmgCoef:6  },
];

function renderVeinEvent(){
  let depth = state.veinDepth;
  if(depth === 0){
    btn("掘る", digVein, "risk", null);
  } else {
    let label = depth < 4 ? "もう1回掘る" : null;
    if(label) btn(label, digVein, "risk", null);
    btn("やめる", leaveVein, "skip");
  }
}

function digVein(){
  let depth = state.veinDepth;
  let p = VEIN_PARAMS[Math.min(depth, 3)];
  let collapseRate = p.collapse;
  // 巧掘の紋：崩落確率を20/30/40/50%に固定
  if(state.relics.some(r => r.id === "skilldig")){
    collapseRate = [0.20, 0.30, 0.40, 0.50][Math.min(depth, 3)];
  }

  if(Math.random() < collapseRate){
    // 崩落
    let tier = Math.floor((state.floor - 1) / 10) + 1;
    let d = tier * p.dmgCoef;
    let actual = damage(d);
    playSE("damage");
    state.veinLastEmerald = false;
    addLog(`地盤が崩れた！ ${actual} ダメージ`, "sub");
    checkDeath();
    if(state.mode !== "dead") state.mode = "explore";
  } else {
    // 成功（前回獲得量以上を保証）
    let g = Math.max(state.veinLastGain, Math.floor(calcScrap() * getMiningMultiplier() * p.mult));
    gainScrap(g);
    state.veinLastGain = g;
    // エメラルドドロップ判定（1回目=depth0は0%、2回目以降は倍率適用）
    const veinEmeraldMult = [0, 1.0, 1.5, 2.0];
    let baseRate = getEmeraldDropRate();
    let emeraldRate = baseRate * (veinEmeraldMult[Math.min(state.veinDepth, 3)]);
    let gotEmerald = emeraldRate > 0 && Math.random() < emeraldRate;
    state.veinLastEmerald = gotEmerald;
    if(gotEmerald){
      gainEmerald(1);
      playSE("emerald");
      addLog(`スクラップ +${g.toLocaleString()} エメラルド +1`, "sub");
    } else {
      playSE("dig");
      addLog(`スクラップ +${g.toLocaleString()}`, "sub");
    }
    state.veinDepth++;
    // 4回目終了 or 続行
    if(state.veinDepth >= 4){
      state.runStats.veinClears++;
      addLog("この鉱脈を掘りつくした！", "sub");
      state.mode = "explore";
    }
    // 4回未満なら event_vein のまま→renderVeinEventがボタンを描画
  }
  render();
}

function leaveVein(){
  addLog("鉱脈から引き上げた", "sub");
  state.veinLastGain = 0;
  state.veinLastEmerald = false;
  state.mode = "explore";
  render();
}

// --- キノコイベント ---
function eatMushroom(){
  state.runStats.mushrooms++;
  state.mushroomBad = false;  // 毎回リセット
  let r = Math.random();
  let isBad = false;
  if(r < 0.40){
    // 毒 40%
    isBad = true;
    applyPoison(1);
    addLog("苦い！ 毒を受けた（1ターン）", "sub");
  } else if(r < 0.80){
    // 回復 40%
    let h = 3 + floorHealBonus();
    heal(h);
    playSE("heal");
    addLog(`甘い香り… HP +${h} 回復した`, "sub");
  } else if(r < 0.90){
    // 採掘力UP 10%
    applyMiningUp(5);
    addLog("不思議な胞子を吸い込んだ… 採掘力UP！（5ターン）", "sub");
  } else if(r < 0.95){
    // 錯乱：階層戻り 5%
    isBad = true;
    let back = Math.min(2, state.floor - 1);
    state.floor -= back;
    addLog(`錯乱した！ ${state.floor}階まで戻ってしまった！`, "sub");
  } else {
    // 錯乱：スクラップ破棄 5%
    isBad = true;
    let lost = Math.floor(state.scrap * 0.1);
    state.scrap = Math.max(0, state.scrap - lost);
    addLog(`錯乱した！ スクラップ ${lost.toLocaleString()} をばらまいた`, "sub");
  }
  state.mushroomBad = isBad;
  checkDeath();
  if(state.mode !== "dead") state.mode = "explore";
  render();
}

// --- 死亡 ---
function checkDeath(){
  if(state.hp <= 0){
    addLog("HPが0になった…", "sub");
    state.mode = "dead";
  }
}

// --- 帰還 ---
function confirmReturn(){
  showConfirm("本当に帰還しますか？<br>（スクラップの半分を持ち帰ります）", () => {
    doReturn();
  });
}

function doReturn(){
  let carry = Math.floor(state.scrap / 2);
  state.totalScrap += carry;
  let emeraldCarry = state.emerald;
  state.totalEmerald += emeraldCarry;
  let newBest = state.maxFloorThisRun > state.bestFloor;
  if(newBest) state.bestFloor = state.maxFloorThisRun;
  commitStats(false, carry);
  state.stats.emerald += emeraldCarry;
  if(carry > state.stats.maxScrapCarry) state.stats.maxScrapCarry = carry;
  if(emeraldCarry > state.stats.maxEmeraldCarry) state.stats.maxEmeraldCarry = emeraldCarry;
  saveAll();
  let unlocks = checkUnlocks();
  // 鉄扉：10階ごとに現れる帰還扉。スクラップ半分を支払って帰還する
  state.lastResult = { survived: true, returnType: "door", floor: state.maxFloorThisRun, carry, emeraldCarry, newBest, unlocks, relics: [...state.relics] };
  saveLastResult(state.lastResult);
  state.mode = "result";
  render();
}

function forceReturn(){
  // ★採掘便り：死亡データをCloudflareへ送信（非同期・失敗は無視）
  // 送信する階数は「死亡した階」= state.floor。
  // アイテムは items[0]（消耗品欄1番目）の effect 文字列。なければ null。
  const deathFloor = state.floor;
  const deathScrap = state.scrap;
  const item0 = state.items[0];
  const itemEffect = (item0 && item0.effect) ? item0.effect : null;
  sendDeathToServer(deathFloor, deathScrap, itemEffect);

  let newBest = state.maxFloorThisRun > state.bestFloor;
  if(newBest) state.bestFloor = state.maxFloorThisRun;
  commitStats(true);
  saveAll();
  let unlocks = checkUnlocks();
  state.lastResult = { survived: false, returnType: "death", floor: state.maxFloorThisRun, carry: 0, emeraldCarry: 0, newBest, unlocks, relics: [...state.relics] };
  saveLastResult(state.lastResult);
  state.mode = "result";
  render();
}

  <div class="parchment-header">◆ 前回の採掘 ◆</div>
  <hr class="parchment-divider">
  <div class="result-badge ${badgeClass}">${badgeLabel}</div>
  <div class="parchment-row">${scrapSVG}<span class="parchment-value">${scrapVal}</span></div>
  <div class="parchment-row">${emerSVG}<span class="parchment-value">${emeraldVal}</span></div>
  <div class="parchment-row"><span class="parchment-label">到達階</span><span class="parchment-value">${floorVal}</span></div>
  <hr class="parchment-divider">
  <div class="parchment-label">使用した紋</div>
  <div class="parchment-relic-row">${relicHTML}</div>
</div>`;
}
function saveLastResult(r){
  localStorage.setItem("lastResult", JSON.stringify({
    returnType:   r.returnType,
    floor:        r.floor,
    carry:        r.carry,
    emeraldCarry: r.emeraldCarry || 0,
    relics:       (r.relics || []).map(rel => rel.id),
  }));
}

function goHome(){
  state.hp    = state.maxHp;
  state.scrap = 0;
  state.emerald = 0;
  state.floor = 1;
  state.maxFloorThisRun = 1;
  state.log   = [];
  state.lastResult = null;
  state.activeCrestId = null;
  state.relicViewOpen = false;
  relicPrevMode = "home";
  // リザルト時に変更したスタイルを元に戻す
  let logEl = document.getElementById("log");
  logEl.style.display = "";
  let ceEl = document.getElementById("current-event");
  ceEl.style.height = "300px";
  ceEl.style.maxHeight = "";
  ceEl.style.overflowY = "auto";
  let tooltipEl = document.getElementById("crest-tooltip");
  if(tooltipEl) tooltipEl.style.display = "none";
  let eventEl = document.getElementById("current-event");
  if(eventEl) eventEl.style.display = "";
  document.getElementById("log").classList.remove("relic-scroll");
  clearBuffs();
  state.mode  = "home";
  render();
}

// --- 女神像イベント ---
// 女神への支払額（スクラップ）を計算
// floor=30,60,90,120,150,180,210,240,270,300階で
//   50,150,300,500/1000,1500,2100/5600,7200,9000,11000... と
// 100階の境目で tierMultiplier が倍になる設計
function getGoddessPrice(floor){
  const n = floor / 30;
  const tier = Math.ceil(floor / 100);  // 1, 2, 3, 4, 5...
  const tierMultiplier = Math.pow(2, tier - 1);  // 1, 2, 4, 8, 16...
  return 25 * n * (n + 1) * tierMultiplier;
}

// 女神回復量（現在HP回復値）。永続強化 goddessHeal Lv0〜6 で +0%〜+30%。
// 初期20%、最大50%、最低保証5HP。
function getGoddessHealAmount(){
  const ratio = 0.20 + state.upgrades.goddessHeal * 0.05;
  return Math.max(5, Math.ceil(state.maxHp * ratio));
}

function goddessHeal(){
  const price = getGoddessPrice(state.floor);
  // 念のため最終チェック（ボタン側でも disabled しているが二重で）
  if(state.scrap < price) return;
  state.scrap -= price;
  state.runStats.goddess++;
  state.goddessUsedFloors.add(state.floor);
  let h = getGoddessHealAmount();
  heal(h);
  playSE("heal");
  addLog(`女神の加護！ HP +${h} 回復した`, "heal");
  addLog(`スクラップ ${price.toLocaleString()} をお布施した`, "sub");
  state.mode = "explore";
  render();
}

function ignoreGoddess(){
  // 「使わない判断をした」も使用扱いとし、同階に戻っても沈黙させる
  state.goddessUsedFloors.add(state.floor);
  playSE("select");
  addLog("一礼して通り過ぎた", "sub");
  state.mode = "explore";
  render();
}

function confirmGoddessReturn(){
  showConfirm("本当に帰還しますか？<br>（スクラップを全額持ち帰ります）", () => {
    goddessReturn();
  });
}

function goddessReturn(){
  state.runStats.goddess++;
  state.goddessUsedFloors.add(state.floor);
  let carry = state.scrap;
  state.totalScrap += carry;
  let emeraldCarry = state.emerald;
  state.totalEmerald += emeraldCarry;
  let newBest = state.maxFloorThisRun > state.bestFloor;
  if(newBest) state.bestFloor = state.maxFloorThisRun;
  commitStats(false, carry);
  state.stats.emerald += emeraldCarry;
  if(carry > state.stats.maxScrapCarry) state.stats.maxScrapCarry = carry;
  if(emeraldCarry > state.stats.maxEmeraldCarry) state.stats.maxEmeraldCarry = emeraldCarry;
  saveAll();
  let unlocks = checkUnlocks();
  state.lastResult = { survived: true, returnType: "goddess", floor: state.maxFloorThisRun, carry, emeraldCarry, goddess: true, newBest, unlocks, relics: [...state.relics] };
  saveLastResult(state.lastResult);
  state.mode = "result";
  render();
}

function continueRun(){
  addLog("さらに深く潜る…");
  state.mode = "explore";
  render();
}

// --- 縦穴ジャンプイベント ---
// 「ジャンプで渡る」ボタン押下
function pitJumpAttempt(){
  // 成功率 = 現在HP / 最大HP
  let chance = state.hp / state.maxHp;
  if(Math.random() < chance){
    // 成功：結果モードへ。floor操作は「採掘する」ボタン押下時に行う
    // 到達予定階層 = 現在の floor + 3（proceedPitJumpで +2、next()で +1）
    playSE("select");
    let targetFloor = state.floor + 3;
    addLog(`ジャンプ成功！ 一気に${targetFloor}階へ降り立った`, "scrap");
    state.pitJumpResult = { success: true, targetFloor };
    state.mode = "event_pitjump_result";
    render();
  } else {
    // 失敗：暗石と同じダメージ計算
    playSE("damage");
    let base = Math.floor(Math.random()*3) + 1 + floorDmgBonus();
    let d = Math.max(1, Math.floor(base / 2));
    let actual = damage(d);
    // 到達予定階層 = 現在の floor - 1（proceedPitJumpで -2、next()で +1）
    let targetFloor = Math.max(1, state.floor - 1);
    addLog(`ジャンプ失敗… 落下して ${actual} ダメージ`, "damage");
    addLog(`${targetFloor}階に落ちた`, "sub");
    if(state.hp <= 0){
      // 死亡時は damage() 内で death モードに遷移済み
      render();
      return;
    }
    state.pitJumpResult = { success: false, dmg: actual, targetFloor };
    state.mode = "event_pitjump_result";
    render();
  }
}

// ジャンプ結果モードの「採掘する」ボタン押下時：floor操作 + next()
function proceedPitJump(){
  let r = state.pitJumpResult || { success: true };
  if(r.success){
    // 成功：+3階（state.floor += 2、その後 next() の +1 で合計+3）
    state.floor += 2;
    state.runStats.floors += 2; // 実階数派
  } else {
    // 失敗：-1階（state.floor -= 2、その後 next() の +1 で合計-1）
    state.floor -= 2;
    state.runStats.floors -= 2; // 実階数派
    if(state.floor < 0) state.floor = 0; // 念のため負数ガード
  }
  state.pitJumpResult = null;
  state.mode = "explore";
  next();
}

// 「迂回する」ボタン押下
function pitJumpDetour(){
  playSE("select");
  applyMiningDown(3);
  addLog("縦穴を迂回した。慎重に進んだが疲れてしまった…", "sub");
  state.mode = "explore";
  render();
}

// --- ショップ購入 ---
// ショップ消耗品の購入定義。新しい消耗品を追加するときはここに1行足す。
const SHOP_CONSUMABLES = {
  potion:   { cost: 1,   name: "ポーション", effect: "hp3" },
  antidote: { cost: 10,  name: "毒消し草",   effect: "antidote" },
  helmet:   { cost: 100, name: "ヘルメット", effect: "guard3" },
};

// ショップで消耗品を購入する共通処理。
// 価格・アイテム情報は SHOP_CONSUMABLES から取得。
function buyConsumable(id){
  const def = SHOP_CONSUMABLES[id];
  if(state.totalScrap < def.cost){ showAlert("スクラップが足りない"); return; }
  if(state.items.length >= 5){ showAlert("持ち物がいっぱい"); return; }
  state.totalScrap -= def.cost;
  state.items.push({ name: def.name, effect: def.effect });
  playSE("coin");
  saveAll();
  render();
}

// HTML側の onclick="buyXxx()" を維持するための後方互換ラッパー。
function buyPotion()   { buyConsumable("potion"); }
function buyAntidote() { buyConsumable("antidote"); }
function buyHelmet()   { buyConsumable("helmet"); }

function buyUnlockHelmet(){
  const cost = 3;
  if(state.unlockedItems.includes("guard3")){ showAlert("すでに解放済み"); return; }
  if(state.totalEmerald < cost){ showAlert("エメラルドが足りない"); return; }
  showConfirm(`エメラルド ${cost} でヘルメットを解放しますか？<br>（消耗品に並ぶようになります）`, () => {
    state.totalEmerald -= cost;
    state.unlockedItems.push("guard3");
    playSE("coin");
    saveAll();
    render();
  });
}

function buyPotionHeal(){
  let cost = getPotionHealCost();
  if(state.totalScrap < cost){ showAlert("スクラップが足りない"); return; }
  let curVal = getPotionHealValue();
  showConfirm(`スクラップ ${cost.toLocaleString()} でポーション回復量を +1 強化しますか？<br>（${curVal} → ${curVal+1}）`, () => {
    state.totalScrap -= cost;
    state.upgrades.potionHeal++;
    playSE("coin");
    saveAll();
    render();
  });
}

function buyHp(){
  let cost = getHpCost();
  if(state.totalScrap < cost){ showAlert("スクラップが足りない"); return; }
  state.totalScrap -= cost;
  state.maxHp++;
  state.hp++;
  state.upgrades.hp++;
  playSE("coin");
  saveAll();
  render();
}

function buyPower(){
  let cost = getPowerCost();
  if(state.totalScrap < cost){ showAlert("スクラップが足りない"); return; }
  state.totalScrap -= cost;
  state.power++;
  state.upgrades.power++;
  playSE("coin");
  saveAll();
  render();
}

render();
// ★採掘便り：起動時にUUIDを確保（無ければ生成・既存ならそのまま）
getPlayerUuid();
showResumeOverlayIfNeeded();

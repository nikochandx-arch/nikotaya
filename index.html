button.nikotaya-press-fx {

}

#log div { margin-bottom: 6px; color: #fff; }

#buff-container {
/* 左右padding を #log と揃え、下に余白をつける。
   境界線は内側の状態行ではなく container 自体に持たせ、
   画面右端まで伸びるようにする（padding の外側に線が引かれる）。 */

padding: 4px 10px;
border-radius: 6px;
font-size: 22px;

}

.buff-good {
color: #0ff;
border: 1px solid #0ff;
background: rgba(0, 255, 255, 0.1);
}

.buff-bad {
color: #f55;
border: 1px solid #f55;
background: rgba(255, 85, 85, 0.1);
}
/* ログ全体に色を付けるクラスは廃止。
   色は colorizeLog 内で対象部分のみ span で付与する方針。
   .log-damage / .log-loss などのクラス名は引き続き付与されるが、CSSで色は指定しない。 */
.log-damage { }
.log-scrap { }
.log-divider { color: #fff; text-align: center; }
.log-loss { }

#top {
display: flex;
flex-direction: column;
max-height: 820px;
}

#header {
padding: 12px 16px 0;
flex-shrink: 0;
}

#current-event {
flex-shrink: 0;
height: 300px;
overflow-y: auto;
margin: 10px 16px;
padding: 20px;
border: 1px solid rgba(0,255,80,0.18);
border-left: 2px solid rgba(0,255,80,0.55);
background: rgba(0,255,80,0.025);
font-size: 34px;
color: #fff;
display: flex;
align-items: flex-start;
gap: 16px;
border-radius: 10px;
position: relative;
}

#current-event-icon {
font-size: 64px;
width: 80px;
text-align: center;
flex-shrink: 0;
}

#current-event-text {
flex: 1;
padding-left: 28px;
}

/* 紋選択／紋入れ替えモード時のメイン画面：
   通常の300px固定 + 横並び(アイコン+テキスト) から、
   画面の残り全部を使い + 縦並びにする。
   紋カードを画面幅フル活用で配置するため。 */
#current-event.relic-pick-mode,
#current-event.relic-swap-mode {
height: auto;
flex: 1 1 auto;
flex-direction: column;
overflow-y: auto;
}
/* 紋選択／紋入れ替えモード時はアイコン枠を撤廃（タイトル行に絵文字組み込み） */
#current-event.relic-pick-mode #current-event-icon,
#current-event.relic-swap-mode #current-event-icon {
display: none;
}
#current-event.relic-pick-mode #current-event-text,
#current-event.relic-swap-mode #current-event-text {
padding-left: 0;
width: 100%;
}

/* 紋入れ替えモード時、紋スロット全体をタップ可能と認識させるための演出。
   全スロットに swap-mode クラスを付与し、ゆっくり脈打つ発光をかける。 */
@keyframes crest-swap-pulse {
0%   { filter: drop-shadow(0 0 4px rgba(0, 255, 255, 0.4)); }
50%  { filter: drop-shadow(0 0 14px rgba(0, 255, 255, 0.9)); }
100% { filter: drop-shadow(0 0 4px rgba(0, 255, 255, 0.4)); }
}
.crest-card.swap-mode {
animation: crest-swap-pulse 1.4s ease-in-out infinite;
}
/* swap中に選択中のスロットは持ち上げ＋強発光で他と差別化 */
.crest-card.swap-selected {
transform: translateY(-8px);
animation: none;
filter: drop-shadow(0 0 16px rgba(0, 255, 255, 1));
}

#log {
/* ログ領域。max-height で固定し、超過分はスクロール。
   画面下の要素（紋スロット・採掘ボタン）へ手が届きやすくするため
   150px に縮めている。 */
flex: 0 1 150px;
min-height: 60px;
max-height: 150px;
overflow-y: auto;
overflow-x: hidden;
padding: 0 16px 12px;
margin-bottom: 16px;
font-size: 20px;
}

#actions {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 12px;
padding: 12px;
}

#bottom {
flex: 1;
padding: 16px;
padding-bottom: 140px;
background: #111;
}

#statusRow {
display: flex;
gap: 12px;
margin-top: 8px;
}

#playerStatus {
flex: 1;
color: #0ff;
font-size: 28px;
}

#itemBox {
flex: 1;
color: #aaffaa;
font-size: 28px;
border-left: 1px solid rgba(0,255,0,0.3);
padding-left: 12px;
}

/* — 紋（装備品）枠のスタイル — */
#crest-container {
/* 5枠を画面幅の約3分の2に縮め、左寄せ。
   justify-content を flex-start にして左詰めし、左右に同じ
   padding（16px）を持たせる。各カードは flex で約 13.3% の幅。
   直下に .crest-slots-wrap（5枠を内包）と .item-button が並ぶ構造。
   5枠を1つのまとまりとして扱い、紋入れ替えイベント時にネオン枠で囲めるようにしている。 */
display: flex;
justify-content: flex-start;
align-items: center;
gap: 8px;
margin-top: 8px;
padding: 0 16px;
width: 100%;
box-sizing: border-box;
}

/* 紋スロット5枠の内包ラッパー。
   旧の #crest-container 直下の flex レイアウトをこちらに移管。
   サイズ感を維持するため、ラッパー幅は「アイテムボタン幅と gap を除いた残り」で
   flex:1 を取り、中の .crest-card は wrap 幅基準で5等分する。 */
.crest-slots-wrap {
display: flex;
gap: 8px;
flex: 1 1 auto;
min-width: 0;
border: 2px solid transparent;
border-radius: 8px;
padding: 4px;
margin: -4px;
transition: border-color 0.2s, box-shadow 0.2s;
}

/* 紋入れ替えイベント中の視線誘導枠：シアン実線＋発光。 */
.crest-slots-wrap.swap-active {
border-color: #0ff;
box-shadow: 0 0 16px rgba(0, 255, 255, 0.7), inset 0 0 8px rgba(0, 255, 255, 0.3);
}

.crest-card {
/* ラッパー内で5枠を均等配置：(100% - gap*4) / 5 = wrap幅基準で20%弱。
   gap が 8px なので、4つの gap が wrap 幅から引かれる。 */
flex: 0 0 calc((100% - 32px) / 5);
min-width: 0;
aspect-ratio: 100 / 140;
cursor: pointer;
transition: transform 0.2s, filter 0.2s;
}

/* hover/active 時の持ち上がり演出はマウス系デバイスに限定。
   タッチデバイスではタップ後に :active 状態が残って持ち上がりが解除されない問題があるため、
   スマホでは isActive (JS制御の activeCrestId) 由来の持ち上がりのみに統一する。 */
@media (hover: hover) {
.crest-card:active, .crest-card:hover {
  transform: translateY(-8px);
  filter: drop-shadow(0 0 8px rgba(0, 255, 0, 0.6));
}
}

.crest-empty {
flex: 0 0 calc((100% - 32px) / 5);
aspect-ratio: 100 / 140;
border: 1px dashed rgba(0, 255, 0, 0.3);
border-radius: 6px;
display: flex;
align-items: center;
justify-content: center;
color: rgba(0, 255, 0, 0.3);
font-size: 14px;
}

/* アイテムボタン：紋カードと縦サイズを合わせる。
   バッグSVG（viewBox 200×130）の比率に合わせて横長。
   紋カードは flex で幅13.3%、aspect-ratio 100/140 で高さ決定。
   こちらも同じ高さにするため、幅を逆算して指定：
   13.3% × (140/100) × (200/130) ≒ 28.65% */
.item-button {
margin-left: auto;
flex: 0 0 calc(13.3% * 1.4 * 200 / 130);
aspect-ratio: 200 / 130;
display: flex;
align-items: center;
justify-content: center;
}
.item-button svg {
height: 100%;
width: 100%;
}

/* 紋フキダシ本体。
   位置は JS（toggleCrestTooltip）で動的設定（タップした紋スロットの真上に出す）。
   --tooltip-color：枠線色（紋ごとに JS で設定）
   --arrow-x      ：下端の三角矢印の横位置（タップした紋カードの中心 X、JS設定） */
.crest-tooltip-box {
position: relative;
background: #2d2d2d;
border: 2px solid var(--tooltip-color, #0f0);
border-radius: 10px;
padding: 14px 20px;
font-size: 24px;
color: var(--tooltip-color, #0f0);
text-align: center;
box-shadow: 0 0 16px rgba(0, 255, 0, 0.5);
}

/* 下向き三角矢印（2層構造で枠線付きを表現）。
   ::before は枠線色の三角（外側）、::after は背景色の三角（内側、1px小さい）。 */
.crest-tooltip-box::before,
.crest-tooltip-box::after {
content: "";
position: absolute;
left: var(--arrow-x, 50%);
width: 0;
height: 0;
border-left: 10px solid transparent;
border-right: 10px solid transparent;
transform: translateX(-50%);
pointer-events: none;
}
.crest-tooltip-box::before {
bottom: -10px;
border-top: 10px solid var(--tooltip-color, #0f0);
}
.crest-tooltip-box::after {
bottom: -7px;
border-left-width: 9px;
border-right-width: 9px;
border-top: 9px solid #2d2d2d;
}

#log.relic-scroll { scrollbar-gutter: stable; padding-right: 12px; }
#log.relic-scroll::-webkit-scrollbar { width: 4px; }
#log.relic-scroll::-webkit-scrollbar-track { background: transparent; margin-right: 4px; }
#log.relic-scroll::-webkit-scrollbar-thumb { background: rgba(170,255,100,0.35); border-radius: 3px; }
#log.relic-scroll::-webkit-scrollbar-thumb:hover { background: rgba(170,255,100,0.65); }

/* — 確認モーダル — */
#modal-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(0, 0, 0, 0.7);
z-index: 1000;
justify-content: center;
align-items: center;
}
#modal-overlay.show { display: flex; }
#modal-box {
background: #1a1a1a;
border: 2px solid #0f0;
border-radius: 12px;
padding: 24px;
max-width: 500px;
width: 80%;
max-height: 90vh;
overflow-y: auto;
box-shadow: 0 0 24px rgba(0, 255, 0, 0.4);
}
#modal-message {
font-size: 24px;
color: #fff;
text-align: center;
margin-bottom: 20px;
line-height: 1.5;
}
#modal-buttons {
display: flex;
gap: 12px;
justify-content: center;
}
#modal-buttons button {
font-size: 22px;
padding: 12px 24px;
min-width: 100px;
cursor: pointer;
border-radius: 8px;
background: transparent;
font-family: inherit;
font-weight: bold;
}
.modal-yes { border: 2px solid #0f0; color: #0f0; background: rgba(0,255,0,0.1) !important; }
.modal-no  { border: 2px solid #aaa; color: #aaa; }

/* — 羊皮紙テーマ（採掘便りなど読み物系モーダル用） — */
/* showModal の opts.theme="parchment" 指定時に
   #modal-box に .theme-parchment クラスが付与される */
#modal-box.theme-parchment {
  background:
    radial-gradient(ellipse at center, rgba(205,180,120,0) 55%, rgba(120,90,40,0.25) 100%),
    linear-gradient(160deg, #e8d9a8 0%, #dece96 30%, #e4d4a0 55%, #d5c07a 80%, #c8b466 100%);
  border: 1.5px solid #9b7c3a;
  border-radius: 6px;
  box-shadow:
    0 0 18px rgba(0,0,0,0.5),
    inset 0 1px 3px rgba(255,255,220,0.6),
    inset 0 -2px 6px rgba(100,70,20,0.2),
    inset 2px 0 6px rgba(100,70,20,0.12),
    inset -2px 0 6px rgba(100,70,20,0.12);
  position: relative;
}
/* 羊皮紙テーマ時のメッセージ部分（文字色を紙色に合わせる） */
#modal-box.theme-parchment #modal-message {
  color: #3a2818;
}
/* 羊皮紙テーマ時はOKボタン群を非表示（外側タップで閉じる仕様） */
#modal-box.theme-parchment #modal-buttons {
  display: none;
}
/* 羊皮紙テーマ時の四隅のシミ（既存 .parchment::before と同じ表現） */
#modal-box.theme-parchment::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 6px;
  background:
    radial-gradient(ellipse at 0% 0%,    rgba(100,60,10,0.18) 0%, transparent 40%),
    radial-gradient(ellipse at 100% 0%,  rgba(100,60,10,0.14) 0%, transparent 35%),
    radial-gradient(ellipse at 0% 100%,  rgba(100,60,10,0.16) 0%, transparent 40%),
    radial-gradient(ellipse at 100% 100%,rgba(100,60,10,0.20) 0%, transparent 38%);
  pointer-events: none;
}

/* === デザインリニューアル v2 === */

@import url(‘https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap’);

body::before {
content: ‘’;
position: fixed;
inset: 0;
background: repeating-linear-gradient(
0deg,
transparent,
transparent 3px,
rgba(0,255,80,0.010) 3px,
rgba(0,255,80,0.010) 4px
);
pointer-events: none;
z-index: 9999;
}

h2::before {
content: ’⬤ ⬤ ⬤  ’;
font-size: 10px;
letter-spacing: 2px;
color: transparent;
text-shadow: 0 0 0 #ff5f57, 14px 0 0 #ffbd2e, 28px 0 0 #28c840;
margin-right: 6px;
}

#status {
display: none !important;
}

#status-grid {
display: grid;
grid-template-columns: 2fr 1fr 1fr 1fr;
gap: 1px;
background: rgba(0,255,80,0.08);
border-top: 1px solid rgba(0,255,80,0.1);
border-bottom: 1px solid rgba(0,255,80,0.1);
margin-bottom: 4px;
}

.stat-cell {
background: #111;
padding: 6px 10px;
}

.stat-label {
font-size: 14px;
letter-spacing: 2px;
color: rgba(0,255,80,0.45);
margin-bottom: 2px;
}

.stat-value {
font-size: 24px;
color: #00ff50;
line-height: 1.2;
text-shadow: 0 0 4px rgba(0,255,80,0.4);
}

.stat-value .stat-sub {
font-size: 16px;
color: rgba(0,255,80,0.5);
}

.stat-value.val-scrap   { color: #ffcc66; text-shadow: 0 0 4px rgba(255,204,102,0.4); }
.stat-value.val-emerald { color: #58d68d; text-shadow: 0 0 4px rgba(88,214,141,0.4); }
.stat-value.val-floor   { color: #fff;    text-shadow: 0 0 4px rgba(255,255,255,0.25); }

.hp-bar-wrap {
margin-top: 4px;
height: 6px;
background: rgba(0,255,80,0.08);
border-radius: 2px;
overflow: hidden;
}

.hp-bar-fill {
height: 100%;
border-radius: 2px;
transition: width 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
}

@media (hover: hover) {
button:hover {
box-shadow: 0 0 18px currentColor !important;
}
}

.precious-icon-btn {
transition: transform 0.2s, filter 0.2s;
}
.precious-icon-btn:active {
transform: translateY(-6px);
filter: drop-shadow(0 0 10px rgba(254,243,199,0.7));
}

/* === カスタムディバイダー === */
:root {
–node-color: #00ff00;
–line-color: rgba(0, 255, 0, 0.5);
}
/* === スリットシールド・ディバイダー ===
   ホーム画面の bottom 領域で各セクション間の装飾区切りに使う。
   左右のラインに挟まれた中央に、斜めスリット3枚 + 小さな矩形 のSVG。
   さびたモスグリーン（彩度低め）でゲーム本体の鮮やかな緑とコントラストを出し、
   「装飾要素である」ことが視覚的にわかるようにしている。 */
.slit-shield-divider {
display: flex;
align-items: center;
width: 100%;
height: 14px;
margin: 16px 0 8px 0;
}
.p3-line-left {
width: 30px;
height: 2px;
background-color: #435e49;
flex-shrink: 0;
}
.p3-svg-shield {
width: 70px;
height: 14px;
color: #435e49;
margin: 0 10px;
flex-shrink: 0;
}
.p3-line-right {
flex-grow: 1;
height: 2px;
background-color: #27382b;
}
.node-blue   { –node-color: #00ffff; –line-color: rgba(0,255,255,0.5); }
.node-orange { –node-color: #ffaa00; –line-color: rgba(255,170,0,0.5); }
.node-red    { –node-color: #ff4444; –line-color: rgba(255,68,68,0.5); }

/* === フロアバッジ（デザイン変更） === */
.floor-badge {
display: inline-block;
background: rgba(0,255,80,0.08);
border: 1px solid rgba(0,255,80,0.4);
border-radius: 5px;
padding: 2px 14px;
font-size: 28px;
color: #ffffff;
letter-spacing: 2px;
text-shadow: 0 0 5px rgba(255,255,255,0.5);
margin-bottom: 8px;
line-height: 1.4;
}
.floor-badge.floor-goddess  { color: #aef; border-color: rgba(170,238,255,0.5); text-shadow: 0 0 5px rgba(170,238,255,0.6); }
.floor-badge.floor-return   { color: #ff9; border-color: rgba(255,255,153,0.5); text-shadow: 0 0 5px rgba(255,255,153,0.6); }
.floor-badge.floor-relic    { color: #f9f; border-color: rgba(255,153,255,0.5); text-shadow: 0 0 5px rgba(255,153,255,0.6); }

/* ── 前回採掘ログ（羊皮紙） ── */
.parchment {
width: 100%;
min-height: 480px;
box-sizing: border-box;
background:
radial-gradient(ellipse at center, rgba(205,180,120,0) 55%, rgba(120,90,40,0.25) 100%),
linear-gradient(160deg, #e8d9a8 0%, #dece96 30%, #e4d4a0 55%, #d5c07a 80%, #c8b466 100%);
border: 1.5px solid #9b7c3a;
border-radius: 6px;
padding: 16px 16px;
box-shadow:
0 0 18px rgba(0,200,80,0.08),
inset 0 1px 3px rgba(255,255,220,0.6),
inset 0 -2px 6px rgba(100,70,20,0.2),
inset 2px 0 6px rgba(100,70,20,0.12),
inset -2px 0 6px rgba(100,70,20,0.12);
position: relative;
font-family: ‘Share Tech Mono’, monospace;
}
.parchment::before {
content: ‘’;
position: absolute;
inset: 0;
border-radius: 6px;
background:
radial-gradient(ellipse at 0% 0%,    rgba(100,60,10,0.18) 0%, transparent 40%),
radial-gradient(ellipse at 100% 0%,  rgba(100,60,10,0.14) 0%, transparent 35%),
radial-gradient(ellipse at 0% 100%,  rgba(100,60,10,0.16) 0%, transparent 40%),
radial-gradient(ellipse at 100% 100%,rgba(100,60,10,0.20) 0%, transparent 38%);
pointer-events: none;
}
.parchment-header {
font-size: 13px;
letter-spacing: 3px;
color: #5a3e1b;
text-align: center;
margin-bottom: 6px;
opacity: 0.7;
}
.parchment-divider {
border: none;
border-top: 1px solid rgba(100,70,20,0.35);
margin: 6px 0;
}
.result-badge {
display: inline-block;
font-size: 15px;
letter-spacing: 1px;
padding: 2px 8px;
border-radius: 4px;
margin-bottom: 6px;
font-family: ‘Share Tech Mono’, monospace;
}
.badge-death   { background: rgba(180,40,30,0.15);  border: 1px solid rgba(180,40,30,0.5);   color: #9b1c0a; }
.badge-door    { background: rgba(180,140,30,0.15); border: 1px solid rgba(180,140,30,0.5);  color: #7a5c0a; }
.badge-goddess { background: rgba(60,80,160,0.12);  border: 1px solid rgba(100,120,200,0.4); color: #2c3e8a; }
.parchment-row {
display: flex;
align-items: center;
gap: 6px;
font-size: 16px;
color: #3b2a0e;
margin: 3px 0;
line-height: 1.5;
}
.parchment-label {
font-size: 15px;
color: #6b4f1e;
opacity: 0.75;
margin-right: 2px;
}
.parchment-value {
color: #2a1800;
font-weight: bold;
}
.parchment-relic-row {
display: flex;

<!-- SVGアイコン定義（本体スクリプトより先に読み込む） -->
<script src="icons.js"></script>

<script>
// --- セーブデータバージョン管理 ---
// --- 統計フィールド定義（一元管理） ---
// RUN_STATS_FIELDS: ラン中も加算する統計（runStats と stats の両方に同名で存在）
// STATS_ONLY_FIELDS: 永続のみで集計する統計（stats のみに存在）
//
// 新しい統計を追加する手順：
//   1. 該当する配列にフィールド名を足す
//   2. 集計タイミング（commitStats または個別箇所）で加算処理を書く
//
// stats への単純フィールド追加では SAVE_VERSION を上げる必要はない。
// loadSaveData() 内で「ALL_STATS_FIELDS の未定義フィールドを 0 で埋める」処理を
// 毎起動時に必ず走らせているため、追加したフィールドが既存セーブでも自動的に 0 になる。
// （SAVE_VERSION を上げ忘れて NaN になる事故を構造的に防ぐ。
//   upgrades 追加・構造変更など 0 補完で済まない変更は従来通り SAVE_VERSION を上げて migrate に書く）
const RUN_STATS_FIELDS  = [
  "floors", "scrap", "damage", "potions", "goddess",
  "goldenMole", "thiefMole", "daigo",
  "chests", "poisonTurns", "mushrooms", "veinClears",
  "batScrap", "merchantBuys", "youki", "beyaku",
];
const STATS_ONLY_FIELDS = [
  "runs", "deaths", "emerald",
  "maxScrapCarry", "maxEmeraldCarry",
];
// stats（永続）に存在すべき全フィールド（initStats / migrate 用）
// 注意：scrap は runStats では使わない（commitStats では carry を直接加算）が、
//       stats 側には必要なため両方に登場する
const ALL_STATS_FIELDS  = [...new Set([...RUN_STATS_FIELDS, ...STATS_ONLY_FIELDS])];

// runStats の初期オブジェクトを生成
function makeRunStats(){
  let o = {};
  RUN_STATS_FIELDS.forEach(f => o[f] = 0);
  return o;
}

const SAVE_VERSION = 7;

// ============================================
// 表示色のルール
// ============================================
// 「色＝意味」の対応をプレイヤーに直感的に伝えるためのルール。
// 数値だけでなく、できる限り「数値＋単位」「効果名＋ターン数」をひとまとめにして色付ける。
// 地の文（動詞や状況説明）は白／グレー、対象語と数値のみが色を持つ。
//
// イベント見出し（深い縦穴／謎のキノコ／謎の商人 など）は基本白字。
// 特定人物（商人・DAIGO・陽キャ等）の名前色付けは将来個別対応する余地を残してある。
const COLORS = {
  damage:   "#f55",     // ダメージ（HP減）
  scrap:    "#ffcc66",  // スクラップ増減（増減は符号で表す）
  emerald:  "#58d68d",  // エメラルド
  heal:     "#aaff66",  // HP回復・デバフ解消（=良いこと）
  buff:     "#22d3ee",  // バフ付与（採掘力UP等）
  debuff:   "#c084fc",  // デバフ付与（毒・採掘量低下等）
  floor:    "#60a5fa",  // 階層変化（縦穴・キノコ錯乱戻り等）
  playerName: "#0ff",   // プレイヤー名強調（ステータス表示の色と同じ）
};

// プレイヤー名を太字＋指定色で強調するヘルパー。
// 商人セリフ・陽キャセリフなど、プレイヤー名を画面に出すときに使う。
// 色は COLORS.playerName を参照しているので、一括変更したい時はここを変えればOK。
function playerNameHTML(){
  return `<span style="color:${COLORS.playerName};font-weight:bold;">${state.name}</span>`;
}

// ============================================
// 採掘便り（Cloudflare連携）
// ============================================
// Cloudflare Worker の API エンドポイント
// （Worker側でR2バケットの最新墓データ1件を管理している）
const LETTER_API_URL = "https://empty-voice-1c60.nikochandx.workers.dev/grave";

// プレイヤーUUIDを取得（無ければ生成して永続保存）
// 「自分の墓データを自分が引かない」判定に使う
function getPlayerUuid(){
  let uuid = localStorage.getItem("playerUuid");
  if(!uuid){
    // crypto.randomUUID() が無い古い環境ではフォールバック
    if(typeof crypto !== "undefined" && crypto.randomUUID){
      uuid = crypto.randomUUID();
    } else {
      // 簡易フォールバック（衝突確率はやや上がるが個人ゲーム規模なら実用上問題ない）
      uuid = "u-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    }
    localStorage.setItem("playerUuid", uuid);
  }
  return uuid;
}

// 死亡時に墓データをCloudflareへ送信する
// 失敗してもユーザー側にエラー表示はしない（リザルト体験を阻害しないため）
async function sendDeathToServer(floor, scrap, itemEffect){
  try {
    const payload = {
      uuid:  getPlayerUuid(),
      name:  state.name,
      floor: floor,
      scrap: scrap,
      item:  itemEffect  // 既知のeffect文字列 or null
    };
    await fetch(LETTER_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    // レスポンス内容は問わない。失敗しても黙る。
  } catch(e){
    // ネットワーク失敗等：無視
  }
}

// 採掘便りを更新する。読込フラグ letterRead=1 のときは通信せず即終了。
// ホーム以外で開いた場合も通信せず即終了（ラン中の便り内容を固定する）。
// 取得した墓データが自分のUUIDだったら、便りは更新しない（ただし読込フラグは立てる）。
// 返り値： { status:"updated"|"skipped_self"|"skipped_same"|"empty"|"throttled"|"error" }
async function fetchLatestLetter(){
  // ホーム以外では通信せず現状維持（ラン中に他人が新しく死んでも、そのランでは反映しない）
  if(state.mode !== "home"){
    return { status: "throttled" };
  }
  // 連打防止フラグ
  if(localStorage.getItem("letterRead") === "1"){
    return { status: "throttled" };
  }
  let resp;
  try {
    resp = await fetch(LETTER_API_URL, { method: "GET" });
  } catch(e){
    return { status: "error" };
  }
  if(!resp.ok){
    return { status: "error" };
  }
  let data;
  try {
    data = await resp.json();
  } catch(e){
    return { status: "error" };
  }
  // 読取成功 → フラグ立てる（次のラン完了まで再読込しない）
  localStorage.setItem("letterRead", "1");

  if(!data.grave){
    return { status: "empty" };
  }
  // 自分の墓は更新しない
  if(data.grave.uuid === getPlayerUuid()){
    return { status: "skipped_self" };
  }
  // 既に表示中の便りと同じ墓データなら更新しない（保険）
  const currentRaw = localStorage.getItem("currentLetter");
  if(currentRaw){
    try {
      const current = JSON.parse(currentRaw);
      if(current && current.uuid === data.grave.uuid &&
         current.diedAt === data.grave.diedAt){
        return { status: "skipped_same" };
      }
    } catch(e){ /* 壊れてたら無視して更新 */ }
  }
  // 便りを更新（新しい墓データになるので、回収済みフラグもリセット）
  localStorage.setItem("currentLetter", JSON.stringify(data.grave));
  localStorage.setItem("currentLetterCollected", "0");
  return { status: "updated", grave: data.grave };
}

// ラン終了時に呼ぶ。次回の採掘便り読込を解禁する。
function resetLetterRead(){
  localStorage.setItem("letterRead", "0");
}

function migrateSaveData(data, fromVersion){
  if(fromVersion < 1){
    if(data.upgrades.potionHeal === undefined) data.upgrades.potionHeal = 0;
    if(data.upgrades.relicSlots === undefined) data.upgrades.relicSlots = 0;
    if(data.upgrades.journal    === undefined) data.upgrades.journal    = false;
  }
  if(fromVersion < 2){
    // v1→v2は stats のフィールド追加のみ。下の共通補完で対応する。
  }
  if(fromVersion < 3){
    // v2→v3：upgrades.tent を追加（中断機能）
    if(data.upgrades.tent === undefined) data.upgrades.tent = false;
  }
  if(fromVersion < 4){
    // v3→v4：stats.youki を追加（陽キャイベント）
    // 共通の補完処理で 0 が入るので個別対応不要
  }
  if(fromVersion < 5){
    // v4→v5：unlockedItems を追加（ショップ「解放」カテゴリ）
    // 既存プレイヤーは未解放状態（空配列）からスタート
    if(data.unlockedItems === undefined) data.unlockedItems = [];
  }
  if(fromVersion < 6){
    // v5→v6：採掘便り機能の追加
    // playerUuid / letterRead / currentLetter は localStorage で個別管理しており
    // loadSaveData の data オブジェクトには含まれない（マイグレーション不要）。
    // 既存プレイヤーは playerUuid を持っていないので、初回起動時に自動生成される。
  }
  if(fromVersion < 7){
    // v6→v7：女神回復量の永続強化を追加（goddessHeal Lv0〜6 / 5%刻み）
    if(data.upgrades.goddessHeal === undefined) data.upgrades.goddessHeal = 0;
  }
  return data;
}

function loadSaveData(){
  let version = parseInt(localStorage.getItem("saveVersion")) || 0;

  let data = {
    upgrades:     JSON.parse(localStorage.getItem("upgrades") || '{"hp":0,"power":0,"potionHeal":0,"relicSlots":0,"journal":false,"tent":false,"goddessHeal":0}'),
    totalScrap:   parseInt(localStorage.getItem("totalScrap"))   || 0,
    totalEmerald: parseInt(localStorage.getItem("totalEmerald")) || 0,
    bestFloor:    parseInt(localStorage.getItem("bestFloor"))    || 1,
    items:        JSON.parse(localStorage.getItem("items")       || "[]"),
    stats:        JSON.parse(localStorage.getItem("stats")       || "{}"),
    playerName:   localStorage.getItem("playerName")             || "プレイヤー",
    seOn:         localStorage.getItem("seOn") !== "false",
    unlockedItems: JSON.parse(localStorage.getItem("unlockedItems") || "[]"),
  };

  if(version < SAVE_VERSION){
    data = migrateSaveData(data, version);
    localStorage.setItem("saveVersion", SAVE_VERSION);
  }

  // stats の共通補完：ALL_STATS_FIELDS の未定義/NaN フィールドを 0 で補う。
  // SAVE_VERSION の昇格に依存せず毎起動時に実行する。
  // これにより RUN_STATS_FIELDS / STATS_ONLY_FIELDS に新しいフィールドを足すだけで
  // 既存セーブでも自動的に 0 で埋まり、commitStats で NaN になる事故を防ぐ。
  // また、過去に何らかの理由で NaN が書き込まれてしまったセーブも 0 に修復する。
  // 新規プレイヤーの空 stats {} もここで初期化される。
  ALL_STATS_FIELDS.forEach(f => {
    if(data.stats[f] === undefined || Number.isNaN(data.stats[f])) data.stats[f] = 0;
  });

  return data;
}

// --- 永続データ読み込み ---
const saved = loadSaveData();

let state = {
  name:         saved.playerName,
  hp:           10 + saved.upgrades.hp,
  maxHp:        10 + saved.upgrades.hp,
  power:        1  + saved.upgrades.power,
  items:        saved.items,
  scrap:        0,
  totalScrap:   saved.totalScrap,
  floor:        1,
  bestFloor:    saved.bestFloor,
  log:          [],
  mode:         "home",
  upgrades:     saved.upgrades,
  lastResult:   null,
  buffs:        [],
  maxFloorThisRun: 1,
  moleBlock:    -1,
  relicViewOpen: false,
  daigoLastFloor:    -999,
  merchantLastFloor: -999,
  pitJumpLastFloor:  -999,
  pitJumpResult:    null,
  relics:           [],
  pendingItem:      null,
  relicEventFloors: new Set(),
  goddessUsedFloors: new Set(),
  relicChoices:     [],
  pendingRelic:     null,
  activeCrestId:    null,
  selectedSwapIndex: null,
  veinDepth:        0,
  veinLastGain:     0,
  veinLastEmerald:  false,
  mushroomBad:      false,
  emerald:          0,
  totalEmerald:     saved.totalEmerald,
  seOn:             saved.seOn,
  unlockedItems:    saved.unlockedItems,
  stats:            saved.stats,
  runStats: makeRunStats()
};

// --- バフ・デバフ定義マスタ ---
// 新しいバフを追加する時はここに1エントリ追加すればOK。
// effects: 効果プロパティ（採掘量倍率など）。「最終的にかける倍率」で統一。
// consumeOn: "turn"（ターン経過で消費・デフォルト）/ "use"（使用時に手動で消費）
// onTurn: 階を進むたびに呼ばれる処理（毒のダメージなど）。不要なら null。
const BUFF_DEF = {
  miningUp: {
    get name(){ return `${SVG_ICONS.pickaxe} 採掘力UP`; },
    isBad: false,
    consumeOn: "turn",
    effects: { miningMultiplier: 2.0 },  // 採掘量×2
    onTurn: null
  },
  miningDown: {
    name: "🤕 採掘量低下",
    isBad: true,
    consumeOn: "turn",
    effects: { miningMultiplier: 0.5 },  // 採掘量×0.5
    onTurn: null
  },
  poison: {
    name: "毒",
    isBad: true,
    consumeOn: "turn",
    effects: {},
    onTurn: () => {
      // 毒ダメージは最大HPの7%。
      let d = Math.max(1, Math.floor(state.maxHp * 0.07));
      // 毒で死なない：HP1を必ず残す
      // （damage関数内にも同じ保証があるが、ここでも明示的にクリップしておく）
      d = Math.min(d, state.hp - 1);
      if(d > 0){
        let actual = damage(d, true); // 毒は非物理ダメージ（鋼皮の紋・ガードの対象外）
        state.runStats.poisonTurns++;
        addLog(`毒ダメージ ${actual}`, "damage");
        state.poisonTickedThisTurn = true;  // 中間モード移行用の一時フラグ
      }
    }
  },
  fragile: {
    // 脆弱デバフ。
    // 受ける物理ダメージを ×1.5 に増幅する（毒など非物理ダメには適用しない）。
    // 諸盾の紋（×2）と重複時は乗算（最終×3.0）。
    // ガード発動時はダメ0なのでそもそも倍率関係なし。
    // 鋼皮の紋（最終-1, 最低1保証）は脆弱倍率の「後」に適用される。
    // 現状は付与源未実装。BUFF_DEF への登録と damage() 側の倍率反映のみ。
    name: "💔 脆弱",
    isBad: true,
    consumeOn: "turn",
    effects: { incomingPhysicalMultiplier: 1.5 },
    onTurn: null
  },
  guard: {
    name: "🛡️ ガード",
    isBad: false,
    consumeOn: "use",
    effects: {},  // 物理ダメージ無効化はdamage()内で個別判定
    onTurn: null
  }
};

// --- バフ管理 ---
// バフID と 残量（turns or uses）を渡して付与する。
// turns/uses はバフ定義の consumeOn に応じて意味が変わる：
//   - consumeOn: "turn" → turns（残ターン数）。既存バフがあれば上書き。
//   - consumeOn: "use"  → uses（残使用回数）。既存バフがあれば加算。
// 内部的にはどちらも `remaining` というフィールドで管理する。
function applyBuffById(id, remaining){
  const def = BUFF_DEF[id];
  if(!def){ console.warn("Unknown buff id:", id); return; }
  // 回数制バフで既に同IDがある場合は加算する
  if(def.consumeOn === "use"){
    let existing = state.buffs.find(b => b.id === id);
    if(existing){
      existing.turns += remaining;
      return;
    }
  }
  // それ以外（ターン制 or 既存なし）は新規追加 or 上書き
  applyBuff({
    id,
    name: def.name,
    isBad: def.isBad,
    consumeOn: def.consumeOn,
    turns: remaining,             // 既存UI互換のため turns プロパティに格納
    effects: def.effects || {},
    onTurn: def.onTurn
  });
}

function applyBuff(buff){
  // 同じidがあれば上書き、なければ追加
  let idx = state.buffs.findIndex(b => b.id === buff.id);
  if(idx >= 0) state.buffs[idx] = buff;
  else state.buffs.push(buff);
}

// 階を進むたびに呼ばれる。ターン消費型バフのみ残量を減らす。
function tickBuffs(){
  state.buffs.forEach(b => {
    if(b.onTurn) b.onTurn();
    if(b.consumeOn === "turn" || b.consumeOn == null){
      b.turns--;
    }
  });
  // 残量0以下になったバフを削除
  state.buffs = state.buffs.filter(b => b.turns > 0);
}

// 回数消費型バフの残量を1減らす（効果が発動した時に呼ぶ）。
// 例：「次の3回の被ダメージを軽減」なら、ダメージを受けた時にこれを呼ぶ。
function consumeBuffUse(id){
  let b = state.buffs.find(x => x.id === id);
  if(!b) return;
  if(b.consumeOn !== "use") return; // ターン消費型には何もしない
  b.turns--;
  if(b.turns <= 0){
    state.buffs = state.buffs.filter(x => x.id !== id);
  }
}

function clearBuffs(){
  state.buffs = [];
  state.moleBlock = -1;
}

// --- SE（Web Audio API） ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

async function initAudio(){
  if(!audioCtx){
    audioCtx = new AudioCtx();
  }
  if(audioCtx.state !== "running"){
    try {
      await audioCtx.resume();
    } catch(e) { /* ignore */ }
  }
  // resumeしても running にならない場合、AudioContextを作り直す
  if(audioCtx.state !== "running"){
    try { audioCtx.close(); } catch(e) { /* ignore */ }
    audioCtx = new AudioCtx();
    try { await audioCtx.resume(); } catch(e) { /* ignore */ }
  }
}

// バックグラウンド復帰時：iOSではAudioContextが壊れることがあるため、
// 強制的に破棄して次回再生時に作り直させる
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden" && audioCtx){
    try { audioCtx.close(); } catch(e) { /* ignore */ }
    audioCtx = null;
  }
});

// pageshow（bfcache復帰）時にも同様の処理
window.addEventListener("pageshow", (e) => {
  if(e.persisted && audioCtx){
    try { audioCtx.close(); } catch(e2) { /* ignore */ }
    audioCtx = null;
  }
});

// 採掘音：ザクッ（こもった土の音）
async function playDigSound(){
  await initAudio();
  const duration = 0.08;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  const src    = audioCtx.createBufferSource();
  src.buffer   = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type  = "lowpass";
  filter.frequency.value = 800;
  const gain   = audioCtx.createGain();
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

  src.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  src.start();
}

// 回復音：ポチョン（清涼感・神秘感）
async function playHealSound(){
  await initAudio();
  const duration = 0.2;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);

  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration);
}

// 購入音：ピロリン（ゲーム風コイン）
async function playCoinSound(){
  await initAudio();
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
  osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08);

  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

// エメラルド発見音：上昇アルペジオ（レア感）
async function playEmeraldSound(){
  await initAudio();
  const now = audioCtx.currentTime;
  [880, 1108, 1318, 1760].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, now + i * 0.05);
    g.gain.setValueAtTime(0, now + i * 0.05);
    g.gain.linearRampToValueAtTime(0.2, now + i * 0.05 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.4);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now + i * 0.05);
    osc.stop(now + i * 0.05 + 0.4);
  });
}

// ボタン選択音：ピコ（汎用ボタンSE）
async function playSelectSound(){
  await initAudio();
  const t = audioCtx.currentTime;
  const partials = [
    { ratio: 1,    vol: 1.0,  decayMult: 1.0  },
    { ratio: 3.73, vol: 0.4,  decayMult: 0.55 },
    { ratio: 7.8,  vol: 0.12, decayMult: 0.25 },
  ];
  const freq  = 1100;
  const decay = 0.3;
  const vol   = 0.25;
  partials.forEach(({ ratio, vol: v, decayMult }) => {
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq * ratio * 1.004, t);
    osc.frequency.exponentialRampToValueAtTime(freq * ratio, t + 0.012);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol * v, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay * decayMult);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + decay * decayMult + 0.05);
  });
}

// ダメージ音：ドスッ（鈍器系打撃）
async function playDamageBlunt(){
  await initAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
  const bufferSize = audioCtx.sampleRate * 0.1;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  const nGain = audioCtx.createGain();
  noise.buffer = noiseBuffer;
  nGain.gain.setValueAtTime(0.2, t);
  nGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
  osc.connect(g); g.connect(audioCtx.destination);
  noise.connect(nGain); nGain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.2);
  noise.start(t);
}

// --- モーダル基盤（共通） ---
function showModal(message, opts){
  let overlay = document.getElementById("modal-overlay");
  let box     = document.getElementById("modal-box");
  document.getElementById("modal-message").innerHTML = message;
  let yesBtn = document.getElementById("modal-yes");
  let noBtn  = document.getElementById("modal-no");
  // 古いリスナー除去のためclone
  let newYes = yesBtn.cloneNode(true);
  let newNo  = noBtn.cloneNode(true);
  yesBtn.parentNode.replaceChild(newYes, yesBtn);
  noBtn.parentNode.replaceChild(newNo, noBtn);

  if(opts.alertOnly){
    newNo.style.display = "none";
    newYes.innerText = "OK";
  } else {
    newNo.style.display = "";
    newYes.innerText = "はい";
  }

  // テーマ切替：opts.theme="parchment" のとき羊皮紙風に
  // 何もないときはデフォルト（緑モーダル）に戻す
  box.classList.remove("theme-parchment");
  // 外側タップで閉じる用の古いリスナーを念のため除去
  overlay.onclick = null;
  if(opts.theme === "parchment"){
    box.classList.add("theme-parchment");
    // 羊皮紙テーマ：外側タップで閉じる仕様
    // （オーバーレイ自身がクリックされた=ボックスの外側がタップされた場合のみ閉じる）
    overlay.onclick = (e) => {
      if(e.target === overlay){
        overlay.classList.remove("show");
        box.classList.remove("theme-parchment");
        overlay.onclick = null;
        if(opts.onClose) opts.onClose();
      }
    };
  }

  overlay.classList.add("show");
  newYes.onclick = () => {
    overlay.classList.remove("show");
    box.classList.remove("theme-parchment");
    overlay.onclick = null;
    if(opts.onYes) opts.onYes();
  };
  newNo.onclick = () => {
    overlay.classList.remove("show");
    box.classList.remove("theme-parchment");
    overlay.onclick = null;
    if(opts.onNo) opts.onNo();
  };
}

function showAlert(message){
  showModal(message, { alertOnly: true });
}

function showConfirm(message, onYes){
  showModal(message, { onYes });
}

// 入力モーダル（テキスト1行入力）
// message: 表示する説明文（HTML可）
// defaultValue: 入力欄の初期値（現在値）
// onSubmit: 入力された値（trim済み・空でないことが保証）を受け取るコールバック
// maxLength: 入力可能な最大文字数（省略時20）
function showInputModal(message, defaultValue, onSubmit, maxLength){
  if(maxLength === undefined) maxLength = 20;
  let overlay = document.getElementById("modal-overlay");
  let box     = document.getElementById("modal-box");
  // メッセージ部分に説明文 + input を組み込む
  let inputId = "modal-input-field";
  document.getElementById("modal-message").innerHTML =
    `${message}<br>` +
    `<input id="${inputId}" type="text" maxlength="${maxLength}" ` +
    `style="width:80%;margin-top:10px;padding:8px;font-size:18px;` +
    `font-family:inherit;background:#111;color:#0f0;` +
    `border:1px solid #0f0;border-radius:4px;text-align:center;` +
    `box-sizing:border-box;" />`;
  let yesBtn = document.getElementById("modal-yes");
  let noBtn  = document.getElementById("modal-no");
  let newYes = yesBtn.cloneNode(true);
  let newNo  = noBtn.cloneNode(true);
  yesBtn.parentNode.replaceChild(newYes, yesBtn);
  noBtn.parentNode.replaceChild(newNo, noBtn);

  newNo.style.display = "";
  newYes.innerText = "OK";
  newNo.innerText = "キャンセル";

  box.classList.remove("theme-parchment");
  overlay.onclick = null;
  overlay.classList.add("show");

  // 表示後にinput取得して初期値セット＆フォーカス
  let inputEl = document.getElementById(inputId);
  inputEl.value = defaultValue || "";
  // モバイルでオートフォーカスが効きにくいことがあるので少し遅延
  setTimeout(() => { try { inputEl.focus(); inputEl.select(); } catch(e){} }, 50);

  let submit = () => {
    let v = (inputEl.value || "").trim();
    if(!v){
      // 空文字（全半角スペースのみ含む）はキャンセル扱いで閉じる
      overlay.classList.remove("show");
      return;
    }
    overlay.classList.remove("show");
    if(onSubmit) onSubmit(v);
  };

  newYes.onclick = submit;
  newNo.onclick = () => {
    overlay.classList.remove("show");
  };
  // Enterキーで決定（PCでテストする場合の補助）
  inputEl.onkeydown = (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      submit();
    }
  };
}

const UNLOCKED_CRESTS = new Set(JSON.parse(localStorage.getItem("unlockedCrests") || "[]"));

// 解放条件判定（必要に応じて条件を追加）
const UNLOCK_CHECKS = {
  beginner:     () => state.bestFloor >= 10,
  mining:       () => state.bestFloor >= 50,
  steel:        () => state.bestFloor >= 50,
  detect:       () => state.bestFloor >= 50,
  friend:       () => state.stats.daigo >= 15,
  skilldig:     () => state.stats.veinClears >= 1,
  potion_boost: () => state.stats.potions >= 50,
  gamble_shield: () => state.stats.youki >= 1,
  // 他の紋は今後追加
};

// 解放チェック：新規解放されたIDの配列を返す
function checkUnlocks(){
  let newlyUnlocked = [];
  for(let id in UNLOCK_CHECKS){
    if(!UNLOCKED_CRESTS.has(id) && UNLOCK_CHECKS[id]()){
      UNLOCKED_CRESTS.add(id);
      newlyUnlocked.push(id);
    }
  }
  if(newlyUnlocked.length > 0){
    localStorage.setItem("unlockedCrests", JSON.stringify([...UNLOCKED_CRESTS]));
  }
  return newlyUnlocked;
}

// ランの統計を永続に加算してリセット
function commitStats(died, carry=0){
  state.stats.runs++;
  if(died) state.stats.deaths++;
  // RUN_STATS_FIELDS の各フィールドを runStats から stats へ加算
  // ただし scrap だけは「持ち帰った量(carry)」を加算する特殊ケース
  RUN_STATS_FIELDS.forEach(f => {
    if(f === "scrap") state.stats.scrap += carry;
    else              state.stats[f]    += state.runStats[f];
  });
  resetRunStats();
  // ★採掘便り：ラン終了したので次回の便り読込を解禁
  resetLetterRead();
}

// --- コスト ---
function getHpCost()      { return Math.floor(50  + state.upgrades.hp    * state.upgrades.hp    * 2); }
function getPowerCost()   { return Math.floor(100 + state.upgrades.power * state.upgrades.power * 3); }
function getPotionHealCost() { return Math.floor(1500 * Math.pow(1.55, state.upgrades.potionHeal)); }
function getPotionHealValue(){ return 3 + state.upgrades.potionHeal; }

// --- 加算ヘルパー ---
// スクラップ・エメラルドの加算は必ずこれを経由する。
// 「state.xxx と state.runStats.xxx を両方加算」のような対の処理を
// 1箇所に閉じ込めることで、加算漏れ・統計記録漏れを構造的に防ぐ。
// 将来「総獲得スクラップ統計」などを増やしたいときも、ここに1行足せば全箇所に反映される。
// 注：減算（買い物などでの消費）は今回は対象外。今後必要に応じてヘルパー化する。
function gainScrap(amount){
  state.scrap += amount;
}
function gainEmerald(amount){
  state.emerald = (state.emerald || 0) + amount;
  state.runStats.emerald += amount;
}

// --- HP処理 ---
// 諸盾の紋（gamble_shield）など、ダメージ値を変動させる紋があるため、
// damage() は適用後の実ダメージを返す。ログ表示などで利用する側はこの戻り値を使うこと。
// ダメージ処理
// d           : 元ダメージ量
// nonPhysical : 物理ダメージかどうか。true なら鋼皮の紋とガードバフを無視する
//               （毒・自傷・将来の特殊ダメージなど、防具・盾で防げないダメージ用）
function damage(d, nonPhysical=false){
  // 諸盾の紋：50%でダメージ無効、50%で2倍（最初に適用）
  let shieldNullified = false;
  if(state.relics.some(r => r.id === "gamble_shield")){
    if(Math.random() < 0.5){
      d = 0;
      shieldNullified = true;
    } else {
      d = d * 2;
    }
  }
  // 💔 脆弱：物理ダメージを ×1.5（端数切り上げ）に増幅。
  // 諸盾とは乗算で重複（諸盾×2 × 脆弱×1.5 = ×3.0）
  // 非物理ダメ（毒など）には適用しない
  // ガード発動なら d=0 になるので倍率は事実上無視される（順序的に正しい）
  if(!nonPhysical){
    let fragile = state.buffs.find(b => b.id === "fragile");
    if(fragile && d > 0){
      let mult = BUFF_DEF.fragile.effects.incomingPhysicalMultiplier || 1.5;
      d = Math.ceil(d * mult);
    }
  }
  // 🛡️ ガードバフ：物理ダメージを完全無効化（諸盾の後、鋼皮の前）。
  // 諸盾の紋でd=0になった場合は「諸盾優先で守られた」扱いで、ガードは消費しない。
  // ヘルメットは希少（採掘中入手不可・アイテム枠5）なので、諸盾とのシナジーで保険として機能させる。
  let guardActivated = false;
  if(!nonPhysical && !shieldNullified){
    let guard = state.buffs.find(b => b.id === "guard");
    if(guard){
      d = 0;
      consumeBuffUse("guard");
      addLog("🛡️ ガードでダメージを無効化した！", "sub");
      guardActivated = true;
    }
  }
  // 鋼皮の紋：物理ダメージを2軽減（最低1）。
  // ただし「ガード発動時」「諸盾でd=0になった時」は最低1保証もスキップして確実に0ダメージにする
  if(!nonPhysical && !guardActivated && !shieldNullified && state.relics.some(r => r.id === "steel")){
    d = Math.max(1, d - 2);
  }
  // 非物理ダメージ（毒など）は最終的に「HP1で止まる」保証をかける
  // 諸盾の紋で2倍になった場合でもここで頭打ちにすることで、毒では死なないルールを維持する
  if(nonPhysical){
    d = Math.max(0, Math.min(d, state.hp - 1));
  }
  let actual = Math.min(d, state.hp);
  state.hp = Math.max(0, state.hp - d);
  state.runStats.damage += actual;
  return d;
}
function heal(v)  { state.hp = Math.min(state.maxHp, state.hp + v); }

// --- ログテキスト色付け ---
// 色ルール：
//   ・色は「数値＋単位」「効果名＋ターン数」のひとまとまりに当てる。
//   ・太字（font-weight:bold）は「数値部分」のみに当てる。
//     例：「2 ダメージ」→ 全体に赤、太字は「2」だけ。
//   ・「毒が治った」など数値を含まない表記は、太字なしの色だけ。
//   ・地の文（動詞や状況説明）は色も太字も付けない。ログのデフォルトは白字。
// 適用順は重要（早い置換が優先される）。
function colorizeLog(text, type){
  // 1. アイテム名を黄緑に（太字あり：固有名詞として強調）
  Object.values(ITEM_DEF).forEach(def => {
    text = text.split(def.name).join(
      `<span style="color:#aaffaa;font-weight:bold;">${def.name}</span>`);
  });

  // 2. ダメージ：「N ダメージ」全体に赤、太字は数値「N」だけ。
  text = text.replace(/(\d+)( ダメージ)/g,
    `<span style="color:${COLORS.damage};font-weight:bold;">$1</span><span style="color:${COLORS.damage};">$2</span>`);
  // 2b. 毒ダメージは「毒ダメージ N」（数値が後ろ）。同様に数値のみ太字。
  text = text.replace(/(毒ダメージ )(\d+)/g,
    `<span style="color:${COLORS.damage};">$1</span><span style="color:${COLORS.damage};font-weight:bold;">$2</span>`);

  // 3. HP回復：「HP +N」「HP+N」全体に緑、太字は数値部分（+N）。
  text = text.replace(/(HP\s*)(\+\d+)/g,
    `<span style="color:${COLORS.heal};">$1</span><span style="color:${COLORS.heal};font-weight:bold;">$2</span>`);

  // 4a. スクラップ符号付き：「スクラップ +N」「スクラップ -N」を黄に。
  //     SVGアイコンは「スクラップ」と数値の間に挿入する（B採用）。
  //     太字は符号付き数値だけ。
  text = text.replace(/(スクラップ )([+\-][\d,]+)/g,
    `<span style="color:${COLORS.scrap};">$1</span>${SVG_ICONS.scrap}<span style="color:${COLORS.scrap};font-weight:bold;">$2</span>`);
  // 4b. スクラップ単独数値（符号なし）：「スクラップ N」を黄に。SVGも挿入。太字は数値のみ。
  text = text.replace(/(スクラップ )([\d,]+)(?![\d,])/g,
    `<span style="color:${COLORS.scrap};">$1</span>${SVG_ICONS.scrap}<span style="color:${COLORS.scrap};font-weight:bold;">$2</span>`);
  // 4c. 「スクラップを N 落とした／ばらまいた」など、数値が文中に来るパターン。
  //     「スクラップを」と「N」を別キャプチャにして、数値だけ太字。色は両方とも黄。
  text = text.replace(/(スクラップを )([\d,]+)/g,
    `<span style="color:${COLORS.scrap};">$1</span><span style="color:${COLORS.scrap};font-weight:bold;">$2</span>`);

  // 5. エメラルド：「エメラルド +N」など。SVGアイコンは数値の前に挿入。
  //    「エメラルド 」は色なし（地の文扱い）、数値だけ緑＋太字。
  //    （色を統一したい場合は spanで包む形に変更可能）
  text = text.replace(/(エメラルド )([+\-]?[\d,]+)/g,
    `<span style="color:${COLORS.emerald};">$1</span>${SVG_ICONS.emerald}<span style="color:${COLORS.emerald};font-weight:bold;">$2</span>`);

  // 6. バフ付与：「採掘力UP！（Nターン）」全体にシアン、太字はターン数「N」だけ。
  text = text.replace(/(採掘力UP！?（)(\d+)(ターン）)/g,
    `<span style="color:${COLORS.buff};">$1</span><span style="color:${COLORS.buff};font-weight:bold;">$2</span><span style="color:${COLORS.buff};">$3</span>`);
  // 6b. 🛡️ガード +N回（バフ付与・回数制）。全体シアン、太字は数値のみ。
  text = text.replace(/(🛡️\s*ガード\s*\+)(\d+)(回)/g,
    `<span style="color:${COLORS.buff};">$1</span><span style="color:${COLORS.buff};font-weight:bold;">$2</span><span style="color:${COLORS.buff};">$3</span>`);

  // 7. デバフ付与：「毒を受けた（Nターン）」「採掘量低下（Nターン）」など。
  //    全体に紫、太字はターン数「N」だけ。
  text = text.replace(/(毒を受けた（)(\d+)(ターン）)/g,
    `<span style="color:${COLORS.debuff};">$1</span><span style="color:${COLORS.debuff};font-weight:bold;">$2</span><span style="color:${COLORS.debuff};">$3</span>`);
  text = text.replace(/(採掘量低下（)(\d+)(ターン）)/g,
    `<span style="color:${COLORS.debuff};">$1</span><span style="color:${COLORS.debuff};font-weight:bold;">$2</span><span style="color:${COLORS.debuff};">$3</span>`);
  // 7d. 「脆弱（Nターン）」もデバフ色付け
  text = text.replace(/(脆弱（)(\d+)(ターン）)/g,
    `<span style="color:${COLORS.debuff};">$1</span><span style="color:${COLORS.debuff};font-weight:bold;">$2</span><span style="color:${COLORS.debuff};">$3</span>`);
  // 7c. デバフ解消「毒が治った」は良いこと扱いで緑（数値なしなので太字なし）。
  text = text.replace(/(毒が治った)/g,
    `<span style="color:${COLORS.heal};">$1</span>`);

  // 8. 階層変化：「N階に落ちた」「N階まで戻ってしまった」「N階へ降り立った」の
  //    色付け範囲は「N階」までに限定。動詞部分（に落ちた／まで戻ってしまった／へ降り立った）は白。
  //    太字は数値「N」だけ。
  text = text.replace(/(\d+)(階)(に落ちた|まで戻ってしまった|へ降り立った)/g,
    `<span style="color:${COLORS.floor};font-weight:bold;">$1</span><span style="color:${COLORS.floor};">$2</span>$3`);

  return text;
}

// --- 絵文字取得 ---
function getEmoji(text, type){
  // テキスト優先チェック（型より先に）
  if(text.includes("金モグラ"))        return SVG_ICONS.goldenMole;
  if(text.includes("泥棒モグラ"))      return SVG_ICONS.thiefMole;
  if(text.includes("陽キャ") || text.includes("あざす") || text.includes("お腹痛")) return SVG_ICONS.youki;
  if(text.includes("深い縦穴") || text.includes("ジャンプ") || text.includes("迂回")) return SVG_ICONS.pitJump;
  if(type==="divider")     return text.includes("女神") ? SVG_ICONS.goddess : SVG_ICONS.door;
  if(type==="damage")      return text.includes("毒") ? SVG_ICONS.poison : "💥";
  if(type==="scrap")       return SVG_ICONS.pickaxe;
  if(text.includes("一休み"))       return SVG_ICONS.campfire;
  if(type==="heal")        return "💤";
  if(type==="loss")        return "🕳️";
  if(type==="sub")         return "";
  if(text.includes("採掘開始"))     return SVG_ICONS.pickaxe;
  if(text.includes("コンテナ"))     return SVG_ICONS.container;
  if(text.includes("鉱脈"))         return SVG_ICONS.vein;
  if(text.includes("キノコ"))       return SVG_ICONS.mushroom;
  if(text.includes("帰還"))         return "🏠";
  if(text.includes("HPが0"))        return "💀";
  if(text.includes("亀裂"))         return "🕳️";
  if(text.includes("有毒ガス"))      return "🌫️";
  if(text.includes("暗闇で岩"))      return "🪨";
  if(text.includes("足を滑らせ"))    return "🧊";
  if(text.includes("手首を痛め"))    return "🤕";
  if(text.includes("コウモリ"))     return "🦇";
  if(text.includes("女神"))         return SVG_ICONS.goddess;
  if(text.includes("加護"))          return SVG_ICONS.goddess;
  if(text.includes("DAIGO"))         return "👤";
  if(text.includes("商人"))          return SVG_ICONS.merchant;
  return "📋";
}

// --- ログ ---
// state.log = [ { floor, lines: [{text, type, emoji}] }, ... ]
// subはその階の最新エントリのlinesに追加、それ以外は新エントリ

// ログを追加する
// text         : 表示テキスト
// type         : ログ種別（normal/scrap/damage/heal/loss/sub/divider など）。色とアイコンに影響する
// iconOverride : アイコンを明示指定したいときに使う（null/未指定なら getEmoji の自動判定）
//                例：墓イベントでアイテム入手時に SVG_ICONS.grave を渡すと、
//                getEmoji によるツルハシ自動選択を無視して墓SVGを表示できる
function addLog(text, type="normal", iconOverride=null){
  let emoji = (iconOverride !== null && iconOverride !== undefined)
    ? iconOverride
    : getEmoji(text, type);

  if(type === "sub"){
    // 最新エントリのlinesに追加
    if(state.log.length > 0){
      state.log[0].lines.push({text, type, emoji});
    }
    return;
  }

  // 新しい階層エントリを先頭に追加
  let entry = {
    floor: state.floor,
    type,           // エントリ全体の代表タイプ（アイコン・色に使う）
    lines: [{text, type, emoji}]
  };
  state.log.unshift(entry);
  state.log = state.log.slice(0, 10); // 10階層分保持
}

// フロアバッジHTML生成
function floorBadgeHTML(floor){
  let extra = "";
  if(floor % 30 === 0)                                        extra = "floor-goddess";
  else if(floor % 10 === 0)                                   extra = "floor-return";
  else if(floor === 15 || (floor > 1 && (floor-1) % 50 === 0)) extra = "floor-relic";
  // 中断可能タイミング（exploreモード）かつテント所持時、階層バッジ右隣（バッジ外）に小さくテント表示
  let tentMark = "";
  if(state.upgrades && state.upgrades.tent && canSuspend()){
    let smallTent = SVG_ICONS.tent
      .replace('width:1.4em;height:1.4em;', 'width:1.1em;height:1.1em;')
      .replace('vertical-align:-0.3em;', 'vertical-align:-0.2em;');
    tentMark = `<span style="font-size:28px;opacity:0.85;vertical-align:middle;">${smallTent}</span>`;
  }
  return `<div class="floor-badge ${extra}">${floor}F</div>${tentMark}`;
}

// --- 描画 ---
// --- ステータスグリッド更新 ---
// HP/SCRAP/EMERALD/FLOOR の値・色・HPバーを更新する。
// render() から呼ばれる。state を参照し対象DOMに書き込むだけで戻り値はない。
function renderStatusGrid(){
  let sgHp = document.getElementById("sg-hp");
  if(sgHp){
    let ratio = state.maxHp > 0 ? state.hp / state.maxHp : 0;
    let hpC = ratio > 0.75 ? "#00ff50"
            : ratio > 0.50 ? "#ddff00"
            : ratio > 0.25 ? "#ff9900"
            : "#ff3333";
    sgHp.innerHTML = `<span style="font-size:14px;color:rgba(0,255,80,0.45);letter-spacing:2px;">HP</span>　${state.hp}<span class="stat-sub">/${state.maxHp}</span>`;
    sgHp.style.color = hpC;
    sgHp.style.textShadow = `0 0 10px ${hpC}88`;
    let bar = document.getElementById("sg-hp-bar");
    if(bar){
      bar.style.width = Math.round(ratio * 100) + "%";
      let barColor = ratio > 0.75 ? "linear-gradient(90deg,#00c844,#00ff50)"
                   : ratio > 0.50 ? "linear-gradient(90deg,#b8cc00,#ddff00)"
                   : ratio > 0.25 ? "linear-gradient(90deg,#cc6600,#ff9900)"
                   : "linear-gradient(90deg,#aa1111,#ff3333)";
      bar.style.background = barColor;
      bar.style.boxShadow  = `0 0 6px ${hpC}`;
    }
  }
  let sgScrap = document.getElementById("sg-scrap");
  if(sgScrap) sgScrap.textContent = state.scrap.toLocaleString();
  let sgEm = document.getElementById("sg-emerald");
  if(sgEm) sgEm.textContent = (state.emerald || 0).toLocaleString();
  let sgFloor = document.getElementById("sg-floor");
  if(sgFloor) sgFloor.textContent = state.floor + "F";
}

const BTN_STYLES = {
  main:    { color: "#0f0",    bg: "rgba(0,255,0,0.1)" },
  risk:    { color: "#ffcc66", bg: "rgba(255,204,102,0.1)" },
  skip:    { color: "#aaa",    bg: "rgba(255,255,255,0.05)" },
  danger:  { color: "#f55",    bg: "rgba(245,85,85,0.1)" },
  special: { color: "#0ff",    bg: "rgba(0,255,255,0.1)" },
  shop:    { color: "#f9f",    bg: "rgba(255,153,255,0.1)" },
};

function btn(t, f, style="main", seName="select"){
  let b = document.createElement("button");
  b.innerText = t;
  b.onclick   = () => { if(seName) playSE(seName); f(); };
  let s = BTN_STYLES[style] || BTN_STYLES.main;
  b.style.borderColor = s.color;
  b.style.color       = s.color;
  b.style.background  = s.bg;
  b.style.boxShadow   = `0 0 10px ${s.color}66`;
  document.getElementById("actions").appendChild(b);
}

// 価格付き・状態依存のボタンを actions エリアに追加するヘルパー。
// 「価格表示＋通貨アイコン＋払えない時グレーアウト」のパターン用。
//   opts.label    : ボタンに表示するメインテキスト
//   opts.price    : 価格（数値）
//   opts.canPay   : 払えるかどうか（false なら disabled + skip スタイル）
//   opts.payStyle : canPay=true 時のスタイル（BTN_STYLES のキー: risk/special など）
//   opts.onClick  : 押下時の関数（canPay=true のときだけ仕込む）
//   opts.seName   : 押下時SE（既定 "select"、null を渡すと自動再生なし）
// 通貨アイコンはスクラップ固定。エメラルド通貨のイベントが必要になったら拡張する。
function btnWithPrice(opts){
  const b = document.createElement("button");
  b.innerHTML =
    `${opts.label}<br>` +
    `<span style="font-size:22px;">${SVG_ICONS.scrap}` +
    `<span style="color:#ffcc66;">${opts.price.toLocaleString()}</span></span>`;
  const s = opts.canPay ? BTN_STYLES[opts.payStyle] : BTN_STYLES.skip;
  b.style.borderColor = s.color;
  b.style.color       = s.color;
  b.style.background  = s.bg;
  b.style.boxShadow   = `0 0 10px ${s.color}66`;
  b.style.opacity     = opts.canPay ? "1" : "0.4";
  b.disabled          = !opts.canPay;
  if(opts.canPay){
    if(opts.seName === null){
      b.onclick = opts.onClick;
    } else {
      const se = opts.seName || "select";
      b.onclick = () => { playSE(se); opts.onClick(); };
    }
  }
  document.getElementById("actions").appendChild(b);
}

// --- アイテムメニュー ---
// ============================================
// アイテムメニュー（モーダル）
// ============================================
// 旧仕様（state.mode="item" でactions領域に展開）からモーダル化に変更。
// prevMode/openItemMenu/closeItemMenu の状態管理は廃止し、
// 現在のmodeを問わずモーダルだけ開閉する。

// アイテム1行を表すHTML文字列を組み立てる共通関数。
// 通常メニュー（モーダル）と満タン時イベント（actions領域）の両方で使う。
//   item    : アイテムオブジェクト { name, effect } または null（空きスロット）
//   index   : 一覧上のインデックス
//   opts    : {
//     showNumber:    true なら "1. " のような番号を表示（通常メニュー）
//     useEnabled:    "使う" ボタンを有効にするか
//     useHandler:    "使う" 押下時の onclick 属性文字列（例 "useItemFromModal(0)"）
//     discardEnabled:"捨てる" ボタンを有効にするか
//     discardHandler:"捨てる" 押下時の onclick 属性文字列
//     newBadge:      true なら NEW バッジを名前の横に表示（満タン時イベント用）
//   }
function buildItemRowHTML(item, index, opts){
  const isEmpty = !item;
  const numLabel = opts.showNumber ? `${index+1}. ` : "";
  const newBadge = opts.newBadge ? ' <span style="color:#0ff;font-size:18px;">NEW</span>' : "";

  // 表示する名前と説明（空きスロットも他と同じ太字・黄緑色を維持）
  let nameLabel, descText;
  if(isEmpty){
    nameLabel = "────";
    descText  = "";
  } else {
    const def = ITEM_DEF[item.effect];
    nameLabel = item.name;
    descText  = def ? def.desc : "";
  }

  // 共通のボタンサイズ（高さ統一・幅はflex:1で親に揃える）
  // min-width:0 を入れることで、テキスト幅に押されて flex:1 が無視されるのを防ぐ
  const btnBase = "font-size:20px;padding:10px 0;min-height:48px;box-sizing:border-box;min-width:0;";

  // 「使う」ボタン
  const useColor = "border-color:#0ff;color:#0ff;background:rgba(0,255,255,0.1);";
  const useStyle = btnBase + useColor + (opts.useEnabled ? "" : "opacity:0.4;");
  const useAttr  = opts.useEnabled ? `onclick="${opts.useHandler}"` : "disabled";

  // 「捨てる」ボタン
  const discardColor = "border-color:#f55;color:#f55;background:rgba(245,85,85,0.1);";
  const discardStyle = btnBase + discardColor + (opts.discardEnabled ? "" : "opacity:0.4;");
  const discardAttr  = opts.discardEnabled ? `onclick="${opts.discardHandler}"` : "disabled";

  // 情報部分のスタイル
  const nameStyle = "font-size:22px;color:#aaffaa;font-weight:bold;line-height:1.3;";
  const descStyle = "font-size:15px;color:#888;margin-top:2px;line-height:1.3;";

  // レイアウト：情報部 : 使う : 捨てる = 2 : 1 : 1
  return `
    <div style="display:flex;align-items:center;gap:8px;width:100%;margin:6px 0;padding:6px 0;border-bottom:1px solid rgba(0,255,0,0.15);">
      <div style="flex:2;text-align:left;min-width:0;">
        <div style="${nameStyle}">${numLabel}${nameLabel}${newBadge}</div>
        <div style="${descStyle}">${descText}</div>
      </div>
      <button style="${useStyle};flex:1;" ${useAttr}>使う</button>
      <button style="${discardStyle};flex:1;" ${discardAttr}>捨てる</button>
    </div>
  `;
}

// アイテムメニュー（モーダル）を開く
// 採掘中・ホーム・コンテナ後など、resultモード以外ならいつでも開ける。
function openItemMenu(){
  if(state.mode === "result") return;
  // 満タン時イベント中はactionsエリアでの選択経路と二重操作になるためロック。
  // render()側でもボタンを無効化しているが、多層防御として明示的に弾く。
  if(state.mode === "event_item_full") return;
  showModal(buildItemMenuHTML(), { alertOnly: true });
}

// モーダル内のHTMLを組み立てる
function buildItemMenuHTML(){
  const heading = `<div style="font-size:26px;color:#fef3c7;margin-bottom:16px;">[ 持ち物 ]</div>`;

  // ホーム時は「使う」不可、それ以外は「使う」可（個別のusableModesも見る）
  const isHome = state.mode === "home";

  // 5枠ぶん描画（空きも含む）
  let rowsHTML = "";
  for(let i = 0; i < 5; i++){
    const item = state.items[i];
    let useEnabled = false;
    if(item){
      const def = ITEM_DEF[item.effect];
      const modeUsable = !def || !def.usableModes || def.usableModes.includes(state.mode);
      useEnabled = !isHome && modeUsable;
    }
    rowsHTML += buildItemRowHTML(item, i, {
      showNumber: true,
      useEnabled: useEnabled,
      useHandler: `useItemFromModal(${i})`,
      discardEnabled: !!item,    // 空きスロットは「捨てる」も無効
      discardHandler: `discardItemFromModal(${i})`,
    });
  }

  // 全部空のときは案内文を中央に
  if(state.items.length === 0){
    rowsHTML = `<div style="font-size:20px;color:#888;text-align:center;padding:24px 0;">持ち物はない</div>`
             + rowsHTML;  // 空欄も下に表示しておく
  }

  return heading + rowsHTML;
}

// モーダル上から「使う」を押したときの処理
// 既存の useItem(index) を呼ぶ前にモーダルを閉じる
function useItemFromModal(index){
  // モーダルを閉じる
  document.getElementById("modal-overlay").classList.remove("show");
  useItem(index);
}

// モーダル上から「捨てる」を押したときの処理
// 既存の discardItem は showConfirm を内部で呼ぶので、
// 先にこっちのモーダルを閉じてから discardItem を呼ぶ。
function discardItemFromModal(index){
  document.getElementById("modal-overlay").classList.remove("show");
  discardItem(index);
}

function useItem(index){
  let item = state.items[index];
  let def  = ITEM_DEF[item.effect];
  if(!def){ return; }

  // 効果発動（共通処理）
  applyItemEffect(item);

  // 消費して上詰め
  state.items.splice(index, 1);
  saveAll();
  render();
}

function discardItem(index){
  let item = state.items[index];
  showConfirm(`「${item.name}」を本当に捨てますか？`, () => {
    state.items.splice(index, 1);
    saveAll();
    render();
  });
}

function startRun(){
  state.hp    = state.maxHp;
  state.scrap = 0;
  state.floor = 1;
  state.maxFloorThisRun = 1;
  state.log   = [];
  clearBuffs();
  resetRunStats();
  state.daigoLastFloor = -999;
  state.merchantLastFloor = -999;
  state.pitJumpLastFloor = -999;
  state.relics = [];
  state.relicEventFloors = new Set();
  state.goddessUsedFloors = new Set();

  state.veinLastGain = 0;
  state.veinLastEmerald = false;
  state.mushroomBad = false;
  state.activeCrestId = null;
  state.mode  = "explore";
  addLog("採掘開始！");
  render();
}

// --- 採掘量計算 ---
function calcScrap(){
  let bonus    = Math.floor((state.floor-1)/10) + 1;
  let base     = state.power * bonus;
  let variance = Math.floor(base * (Math.random() - 0.5) * 0.14);  // ±7%
  return Math.max(1, base + variance);
}

// --- 採掘倍率計算 ---
function getMiningMultiplier(){
  // バフ・デバフの effects.miningMultiplier を全部掛け合わせる
  return state.buffs
    .filter(b => b.effects && b.effects.miningMultiplier != null)
    .reduce((mult, b) => mult * b.effects.miningMultiplier, 1);
}

// 採掘便り本体：他の鉱夫の最新墓データを表示するモーダル
// 開いた瞬間に Cloudflare から最新データを取りに行く（letterRead フラグで連打防止）。
// 通信前後で modal-message の中身を動的に書き換える。
function openJournalModal(){
  if(!state.upgrades.journal) return;

  // 1) 先に「読込中」の状態でモーダルを表示（羊皮紙テーマ）
  showModal(buildLetterHTML("loading"), { alertOnly: true, theme: "parchment" });

  // 2) 非同期で取得 → モーダルの中身を結果に差し替え
  fetchLatestLetter().then(result => {
    const msgEl = document.getElementById("modal-message");
    if(!msgEl) return; // モーダルが閉じられた後なら何もしない
    msgEl.innerHTML = buildLetterHTML(result.status);
  }).catch(() => {
    const msgEl = document.getElementById("modal-message");
    if(!msgEl) return;
    msgEl.innerHTML = buildLetterHTML("error");
  });
}

// 採掘便りモーダルの中身HTMLを組み立てる
// state: "loading" | "updated" | "skipped_self" | "skipped_same" | "throttled" | "empty" | "error"
// 配色は羊皮紙テーマ前提（背景がベージュ系なので、文字は茶〜黒系）
function buildLetterHTML(status){
  const heading = `<div style="font-size:22px;letter-spacing:3px;color:#5a3e1b;text-align:center;margin-bottom:8px;opacity:0.8;">◆ 採掘便り ◆</div>
                   <hr style="border:none;border-top:1px solid rgba(100,70,20,0.35);margin:6px 0 14px 0;">`;

  if(status === "loading"){
    return heading +
      `<div style="font-size:20px;color:#7a5a2e;text-align:center;padding:24px 0;">便りを取り寄せています…</div>`;
  }

  // 現在保存中の便り（あれば）
  let current = null;
  try {
    const raw = localStorage.getItem("currentLetter");
    if(raw) current = JSON.parse(raw);
  } catch(e){ /* 無視 */ }

  // 通信エラー時
  if(status === "error"){
    let body = `<div style="font-size:18px;color:#9b1c0a;text-align:center;padding:12px 0;">便りを取り寄せられませんでした</div>`;
    if(current){
      body += `<div style="font-size:16px;color:#7a5a2e;text-align:center;margin-bottom:8px;">― 前回の便り ―</div>`;
      body += renderGrave(current);
    }
    return heading + body;
  }

  // 自分の墓だった / 同じ便り / 連打抑制 / 更新成功
  // → currentLetterがそのまま真実。自分の墓は完全透明扱い。
  if(current){
    return heading + renderGrave(current);
  }

  // currentLetter が無い状態（=このゲームで一度も他人の死亡データを受信していない）
  return heading +
    `<div style="font-size:20px;color:#7a5a2e;text-align:center;padding:24px 0;">便りはまだ届いていない…</div>`;
}

// ISO 8601文字列（UTC） → 日本時間の時間帯ラベル
// 5:00-10:59 → "朝方"、11:00-17:59 → "昼間"、18:00-04:59 → "夜方"
function getTimeOfDayLabel(isoString){
  if(!isoString) return "";
  let d;
  try { d = new Date(isoString); }
  catch(e){ return ""; }
  if(isNaN(d.getTime())) return "";
  const h = d.getHours();
  if(h >= 5  && h <= 10) return "朝方";
  if(h >= 11 && h <= 17) return "昼間";
  return "夜方"; // 18-23 と 0-4
}

// 個別の墓データを「お便り」風に表示するHTML片を組み立てる
// 遺品情報は表示しない（墓イベントでサプライズとして判明する形にする）
// 配色は羊皮紙テーマ前提：本文は焦茶、強調は深い赤茶系
function renderGrave(grave){
  const safeName = String(grave.name || "名もなき鉱夫").replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
  const timeLabel = getTimeOfDayLabel(grave.diedAt);
  const floorText = `${grave.floor}階`;

  // 倒れた採掘者SVG（大きめに表示）
  const fallenSvg = SVG_ICONS.fallenMiner
    .replace('width:1em;height:1em;', 'width:9em;height:9em;')
    .replace('vertical-align:-0.2em;', 'vertical-align:middle;');

  // 紙の上で読みやすい配色：本文は焦茶 #3a2818、強調は深い赤茶 #9b1c0a
  return `
    <div style="font-size:21px;color:#3a2818;text-align:center;line-height:1.7;padding:4px 0;">
      <div style="margin-bottom:6px;">
        ${timeLabel ? `<span>${timeLabel}</span> ` : ""}<span style="color:#1f1208;font-weight:bold;">${safeName}</span> さんが
      </div>
      <div style="margin-bottom:6px;">
        <span style="color:#9b1c0a;font-weight:bold;">${floorText}</span> で死亡しました。
      </div>
      <div style="font-size:17px;color:#5a3e1b;margin-top:4px;">皆さんも気をつけましょう。</div>
      <div style="margin-top:10px;line-height:1;">${fallenSvg}</div>
    </div>
  `;
}

// テントアイコンタップ：ホーム時は無反応、採掘中は中断 or 中断不可吹き出し
function onTentTap(ev){
  if(ev) ev.stopPropagation();
  if(!state.upgrades.tent) return;
  if(state.mode === "home" || state.mode === "result") return;  // ホーム時は無反応

  if(canSuspend()){
    // 中断実行
    suspendRun();
  } else {
    // 中断不可吹き出し
    showTentTooltip("今は中断できません");
  }
}

// 中断可能判定：「次へ」を押す前のexploreモード時のみ true
function canSuspend(){
  return state.mode === "explore";
}

// テント吹き出し表示
function showTentTooltip(message){
  let tooltipEl = document.getElementById("tent-tooltip");
  if(!tooltipEl) return;
  tooltipEl.style.display = "block";
  tooltipEl.innerHTML = `<div style="background:#2d2d2d;border:2px solid #facc15;border-radius:10px;
    padding:14px 20px;font-size:24px;color:#facc15;text-align:center;
    box-shadow:0 0 16px rgba(250,204,21,0.5);">${message}</div>`;
}

function hideTentTooltip(){
  let tooltipEl = document.getElementById("tent-tooltip");
  if(tooltipEl) tooltipEl.style.display = "none";
}

// --- 中断・再開機能 ---
function suspendRun(){
  let data = {
    floor: state.floor,
    maxFloorThisRun: state.maxFloorThisRun,
    hp: state.hp,
    maxHp: state.maxHp,
    power: state.power,
    scrap: state.scrap,
    emerald: state.emerald,
    items: state.items,
    relics: state.relics,
    buffs: state.buffs,
    runStats: state.runStats,
    relicEventFloors: [...state.relicEventFloors],
    goddessUsedFloors: [...state.goddessUsedFloors],
    daigoLastFloor: state.daigoLastFloor,
    merchantLastFloor: state.merchantLastFloor,
    pitJumpLastFloor: state.pitJumpLastFloor,
    moleBlock: state.moleBlock,
    mushroomBad: state.mushroomBad,
    veinDepth: state.veinDepth,
    veinLastGain: state.veinLastGain,
    veinLastEmerald: state.veinLastEmerald
  };
  localStorage.setItem("suspendedRun", JSON.stringify(data));
  // ホームに戻す（ログはクリア）→ そのまま再開オーバーレイを表示
  goHome();
  showResumeOverlayIfNeeded();
}

// 再開：中断データから state を復元して採掘モードへ
function resumeRun(){
  let raw = localStorage.getItem("suspendedRun");
  if(!raw) return;
  let data;
  try { data = JSON.parse(raw); } catch(e){ localStorage.removeItem("suspendedRun"); return; }

  // 中断データを復元（再開した時点で必ず破棄）
  localStorage.removeItem("suspendedRun");

  state.floor = data.floor;
  state.maxFloorThisRun = data.maxFloorThisRun ?? data.floor;
  state.hp = data.hp;
  state.maxHp = data.maxHp;
  state.power = data.power;
  state.scrap = data.scrap;
  state.emerald = data.emerald;
  state.items = data.items;
  state.relics = data.relics;
  // バフ復元：旧フォーマット（miningBonus/miningPenalty を直接持つ）から
  // 新フォーマット（effects.miningMultiplier）へ自動移行する
  state.buffs = (data.buffs || []).map(b => {
    if(b.effects) return b; // 既に新フォーマット
    // 旧フォーマットを変換
    let newBuff = {
      id: b.id,
      name: b.name,
      isBad: b.isBad,
      turns: b.turns,
      consumeOn: "turn",
      effects: {},
      onTurn: null
    };
    if(b.miningBonus)   newBuff.effects.miningMultiplier = (1 + b.miningBonus);
    if(b.miningPenalty) newBuff.effects.miningMultiplier = b.miningPenalty;
    // 毒の onTurn はBUFF_DEFから再生
    if(BUFF_DEF[b.id] && BUFF_DEF[b.id].onTurn){
      newBuff.onTurn = BUFF_DEF[b.id].onTurn;
    }
    return newBuff;
  });
  state.runStats = data.runStats;
  state.relicEventFloors = new Set(data.relicEventFloors);
  state.goddessUsedFloors = new Set(data.goddessUsedFloors || []);
  state.daigoLastFloor = data.daigoLastFloor;
  state.merchantLastFloor = data.merchantLastFloor;
  state.pitJumpLastFloor = data.pitJumpLastFloor ?? -999;
  state.moleBlock = data.moleBlock;
  state.mushroomBad = data.mushroomBad;
  state.veinDepth = data.veinDepth;
  state.veinLastGain = data.veinLastGain;
  state.veinLastEmerald = data.veinLastEmerald;
  state.log = [];
  state.lastResult = null;
  state.activeCrestId = null;
  state.relicViewOpen = false;
  state.mode = "explore";

  addLog("休憩おわり、冒険を再開しよう");
  hideResumeOverlay();
  render();
}

function buyRelicSlot(){

// --- エメラルドドロップ確率 ---
function getEmeraldDropRate(){
  if(state.floor < 30) return 0;
  return Math.min(0.135, Math.floor((state.floor - 30) / 10) * 0.005); // 0.5%ずつ増加、上限13.5%
}

// --- 階層補正ヘルパー ---
function floorDmgBonus()  { return Math.floor(state.floor / 10); }
function floorHealBonus() { return Math.floor(state.floor / 20); }

// --- イベント発生条件マスタ ---
function EVENT_COND(){
  return {
    lowHp:      state.hp / state.maxHp <= 0.25,
    highHp:     state.hp / state.maxHp >= 0.75,
    isPoisoned: state.buffs.some(b => b.id === "poison"),
    miningUp:   state.buffs.some(b => b.id === "miningUp"),
    miningDown: state.buffs.some(b => b.id === "miningDown"),
    itemEmpty:  state.items.length === 0,
    itemFull:   state.items.length >= 5,
    hasPotion:  state.items.some(i => i.effect === "hp3"),
    richScrap:  state.scrap >= 200,
    poorScrap:  state.scrap === 0,
    hasEmerald: state.emerald > 0,
  };
}

// --- イベント抽選用コンテキスト ---
// 各イベントの condition 関数に渡される。state直アクセスより読みやすく、
// 将来テストや特殊ロジック追加時にも扱いやすい。
function buildEventCtx(){
  return {
    state,                                                  // state全体への参照
    floor:    state.floor,                                  // 現在階層
    cond:     EVENT_COND(),                                 // 派生条件まとめ
    hasRelic: id => state.relics.some(r => r.id === id),    // 紋装備中か
    hasItem:  effect => state.items.some(i => i.effect === effect), // 特定効果アイテム所持中か
  };
}

// --- 重み付きイベント抽選 ---
// condition を満たすイベントだけを対象に重み付き抽選する。
// 全件 condition 不一致なら、condition 無しのイベントだけで抽選（fallback）。
function pickWeightedEvent(events, ctx){
  let avail = events.filter(e => !e.condition || e.condition(ctx));
  if(avail.length === 0) avail = events.filter(e => !e.condition);
  let total = avail.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for(let e of avail){
    r -= e.weight;
    if(r <= 0) return e;
  }
  return avail[avail.length - 1];
}

function isSpecialFloor(f){
  if(f % 30 === 0) return true; // 女神像
  if(f === 15) return true;     // 紋階（初回）
  if(f > 1 && (f - 1) % 50 === 0) return true; // 紋階（51, 101, 151...）
  return false;
}

<!-- SVGアイコン定義（本体スクリプトより先に読み込む） -->
<script src="icons.js"></script>

<script>
// --- セーブデータバージョン管理 ---
// --- 統計フィールド定義（一元管理） ---
// RUN_STATS_FIELDS: ラン中も加算する統計（runStats と stats の両方に同名で存在）
// STATS_ONLY_FIELDS: 永続のみで集計する統計（stats のみに存在）
//
// 新しい統計を追加する手順：
//   1. 該当する配列にフィールド名を足す
//   2. SAVE_VERSION を1上げて、migrateSaveData の if(fromVersion < N) ブロックに
//      初期値補完を書く（STATS_ONLY_FIELDS と RUN_STATS_FIELDS は migrateSaveData では
//      自動補完されないので、必要なら個別に追記する）
//   3. 集計タイミング（commitStats または個別箇所）で加算処理を書く
const RUN_STATS_FIELDS  = [
  "floors", "scrap", "damage", "potions", "goddess",
  "goldenMole", "thiefMole", "daigo",
  "chests", "poisonTurns", "mushrooms", "veinClears",
  "batScrap", "merchantBuys", "youki",
];
const STATS_ONLY_FIELDS = [
  "runs", "deaths", "emerald",
  "maxScrapCarry", "maxEmeraldCarry",
];
// stats（永続）に存在すべき全フィールド（initStats / migrate 用）
// 注意：scrap は runStats では使わない（commitStats では carry を直接加算）が、
//       stats 側には必要なため両方に登場する
const ALL_STATS_FIELDS  = [...new Set([...RUN_STATS_FIELDS, ...STATS_ONLY_FIELDS])];

// runStats の初期オブジェクトを生成
function makeRunStats(){
  let o = {};
  RUN_STATS_FIELDS.forEach(f => o[f] = 0);
  return o;
}

const SAVE_VERSION = 6;

// ============================================
// 採掘便り（Cloudflare連携）
// ============================================
// Cloudflare Worker の API エンドポイント
// （Worker側でR2バケットの最新墓データ1件を管理している）
const LETTER_API_URL = "https://empty-voice-1c60.nikochandx.workers.dev/grave";

// プレイヤーUUIDを取得（無ければ生成して永続保存）
// 「自分の墓データを自分が引かない」判定に使う
function getPlayerUuid(){
  let uuid = localStorage.getItem("playerUuid");
  if(!uuid){
    // crypto.randomUUID() が無い古い環境ではフォールバック
    if(typeof crypto !== "undefined" && crypto.randomUUID){
      uuid = crypto.randomUUID();
    } else {
      // 簡易フォールバック（衝突確率はやや上がるが個人ゲーム規模なら実用上問題ない）
      uuid = "u-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    }
    localStorage.setItem("playerUuid", uuid);
  }
  return uuid;
}

// 死亡時に墓データをCloudflareへ送信する
// 失敗してもユーザー側にエラー表示はしない（リザルト体験を阻害しないため）
async function sendDeathToServer(floor, scrap, itemEffect){
  try {
    const payload = {
      uuid:  getPlayerUuid(),
      name:  state.name,
      floor: floor,
      scrap: scrap,
      item:  itemEffect  // 既知のeffect文字列 or null
    };
    await fetch(LETTER_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    // レスポンス内容は問わない。失敗しても黙る。
  } catch(e){
    // ネットワーク失敗等：無視
  }
}

// 採掘便りを更新する。読込フラグ letterRead=1 のときは通信せず即終了。
// 取得した墓データが自分のUUIDだったら、便りは更新しない（ただし読込フラグは立てる）。
// 返り値： { status:"updated"|"skipped_self"|"skipped_same"|"empty"|"throttled"|"error" }
async function fetchLatestLetter(){
  // 連打防止フラグ
  if(localStorage.getItem("letterRead") === "1"){
    return { status: "throttled" };
  }
  let resp;
  try {
    resp = await fetch(LETTER_API_URL, { method: "GET" });
  } catch(e){
    return { status: "error" };
  }
  if(!resp.ok){
    return { status: "error" };
  }
  let data;
  try {
    data = await resp.json();
  } catch(e){
    return { status: "error" };
  }
  // 読取成功 → フラグ立てる（次のラン完了まで再読込しない）
  localStorage.setItem("letterRead", "1");

  if(!data.grave){
    return { status: "empty" };
  }
  // 自分の墓は更新しない
  if(data.grave.uuid === getPlayerUuid()){
    return { status: "skipped_self" };
  }
  // 既に表示中の便りと同じ墓データなら更新しない（保険）
  const currentRaw = localStorage.getItem("currentLetter");
  if(currentRaw){
    try {
      const current = JSON.parse(currentRaw);
      if(current && current.uuid === data.grave.uuid &&
         current.diedAt === data.grave.diedAt){
        return { status: "skipped_same" };
      }
    } catch(e){ /* 壊れてたら無視して更新 */ }
  }
  // 便りを更新
  localStorage.setItem("currentLetter", JSON.stringify(data.grave));
  return { status: "updated", grave: data.grave };
}

// ラン終了時に呼ぶ。次回の採掘便り読込を解禁する。

}

function migrateSaveData(data, fromVersion){
  if(fromVersion < 1){
    if(data.upgrades.potionHeal === undefined) data.upgrades.potionHeal = 0;
    if(data.upgrades.relicSlots === undefined) data.upgrades.relicSlots = 0;
    if(data.upgrades.journal    === undefined) data.upgrades.journal    = false;
  }
  if(fromVersion < 2){
    // v1→v2は stats のフィールド追加のみ。下の共通補完で対応する。
  }
  if(fromVersion < 3){
    // v2→v3：upgrades.tent を追加（中断機能）
    if(data.upgrades.tent === undefined) data.upgrades.tent = false;
  }
  if(fromVersion < 4){
    // v3→v4：stats.youki を追加（陽キャイベント）
    // 共通の補完処理で 0 が入るので個別対応不要
  }
  if(fromVersion < 5){
    // v4→v5：unlockedItems を追加（ショップ「解放」カテゴリ）
    // 既存プレイヤーは未解放状態（空配列）からスタート
    if(data.unlockedItems === undefined) data.unlockedItems = [];
  }
  if(fromVersion < 6){
    // v5→v6：採掘便り機能の追加
    // playerUuid / letterRead / currentLetter は localStorage で個別管理しており
    // loadSaveData の data オブジェクトには含まれない（マイグレーション不要）。
    // 既存プレイヤーは playerUuid を持っていないので、初回起動時に自動生成される。
  }
  // 共通：ALL_STATS_FIELDS の未定義フィールドを 0 で補う
  // （新規プレイヤーの空 stats {} もここで初期化される）
  ALL_STATS_FIELDS.forEach(f => {
    if(data.stats[f] === undefined) data.stats[f] = 0;
  });
  return data;
}

function loadSaveData(){
  let version = parseInt(localStorage.getItem("saveVersion")) || 0;

  let data = {
    upgrades:     JSON.parse(localStorage.getItem("upgrades") || '{"hp":0,"power":0,"potionHeal":0,"relicSlots":0,"journal":false,"tent":false}'),
    totalScrap:   parseInt(localStorage.getItem("totalScrap"))   || 0,
    totalEmerald: parseInt(localStorage.getItem("totalEmerald")) || 0,
    bestFloor:    parseInt(localStorage.getItem("bestFloor"))    || 1,
    items:        JSON.parse(localStorage.getItem("items")       || "[]"),
    stats:        JSON.parse(localStorage.getItem("stats")       || "{}"),
    playerName:   localStorage.getItem("playerName")             || "プレイヤー",
    seOn:         localStorage.getItem("seOn") !== "false",
    unlockedItems: JSON.parse(localStorage.getItem("unlockedItems") || "[]"),
  };

  if(version < SAVE_VERSION){
    data = migrateSaveData(data, version);
    localStorage.setItem("saveVersion", SAVE_VERSION);
  }

  return data;
}

// 新しいバフを追加する時はここに1エントリ追加すればOK。
// effects: 効果プロパティ（採掘量倍率など）。「最終的にかける倍率」で統一。
// consumeOn: "turn"（ターン経過で消費・デフォルト）/ "use"（使用時に手動で消費）
// onTurn: 階を進むたびに呼ばれる処理（毒のダメージなど）。不要なら null。
const BUFF_DEF = {
  miningUp: {
    get name(){ return `${SVG_ICONS.pickaxe} 採掘力UP`; },
    isBad: false,
    consumeOn: "turn",
    effects: { miningMultiplier: 2.0 },  // 採掘量×2

  },

// --- バフ管理 ---
// バフID と 残量（turns or uses）を渡して付与する。
// turns/uses はバフ定義の consumeOn に応じて意味が変わる：
//   - consumeOn: "turn" → turns（残ターン数）。既存バフがあれば上書き。
//   - consumeOn: "use"  → uses（残使用回数）。既存バフがあれば加算。
// 内部的にはどちらも `remaining` というフィールドで管理する。
function applyBuffById(id, remaining){
  const def = BUFF_DEF[id];
  if(!def){ console.warn("Unknown buff id:", id); return; }
  // 回数制バフで既に同IDがある場合は加算する
  if(def.consumeOn === "use"){
    let existing = state.buffs.find(b => b.id === id);
    if(existing){
      existing.turns += remaining;
      return;
    }
  }
  // それ以外（ターン制 or 既存なし）は新規追加 or 上書き
  applyBuff({
    id,
    name: def.name,
    isBad: def.isBad,
    consumeOn: def.consumeOn,
    turns: remaining,             // 既存UI互換のため turns プロパティに格納
    effects: def.effects || {},
    onTurn: def.onTurn
  });
}

function applyBuff(buff){
  // 同じidがあれば上書き、なければ追加
  let idx = state.buffs.findIndex(b => b.id === buff.id);
  if(idx >= 0) state.buffs[idx] = buff;
  else state.buffs.push(buff);
}

// 階を進むたびに呼ばれる。ターン消費型バフのみ残量を減らす。
function tickBuffs(){
  state.buffs.forEach(b => {
    if(b.onTurn) b.onTurn();
    if(b.consumeOn === "turn" || b.consumeOn == null){
      b.turns--;
    }
  });
  // 残量0以下になったバフを削除
  state.buffs = state.buffs.filter(b => b.turns > 0);
}

// 回数消費型バフの残量を1減らす（効果が発動した時に呼ぶ）。
// 例：「次の3回の被ダメージを軽減」なら、ダメージを受けた時にこれを呼ぶ。
function consumeBuffUse(id){
  let b = state.buffs.find(x => x.id === id);
  if(!b) return;
  if(b.consumeOn !== "use") return; // ターン消費型には何もしない
  b.turns--;
  if(b.turns <= 0){
    state.buffs = state.buffs.filter(x => x.id !== id);
  }
}

function clearBuffs(){
  state.buffs = [];
  state.moleBlock = -1;
}

// --- SE（Web Audio API） ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

async function initAudio(){
  if(!audioCtx){
    audioCtx = new AudioCtx();
  }
  if(audioCtx.state !== "running"){
    try {
      await audioCtx.resume();
    } catch(e) { /* ignore */ }
  }
  // resumeしても running にならない場合、AudioContextを作り直す
  if(audioCtx.state !== "running"){
    try { audioCtx.close(); } catch(e) { /* ignore */ }
    audioCtx = new AudioCtx();
    try { await audioCtx.resume(); } catch(e) { /* ignore */ }
  }
}

// バックグラウンド復帰時：iOSではAudioContextが壊れることがあるため、
// 強制的に破棄して次回再生時に作り直させる
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden" && audioCtx){
    try { audioCtx.close(); } catch(e) { /* ignore */ }
    audioCtx = null;
  }
});

// pageshow（bfcache復帰）時にも同様の処理
window.addEventListener("pageshow", (e) => {
  if(e.persisted && audioCtx){
    try { audioCtx.close(); } catch(e2) { /* ignore */ }
    audioCtx = null;
  }
});

// 採掘音：ザクッ（こもった土の音）
async function playDigSound(){
  await initAudio();
  const duration = 0.08;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  const src    = audioCtx.createBufferSource();
  src.buffer   = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type  = "lowpass";
  filter.frequency.value = 800;
  const gain   = audioCtx.createGain();
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

  src.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  src.start();
}

// 回復音：ポチョン（清涼感・神秘感）
async function playHealSound(){
  await initAudio();
  const duration = 0.2;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);

  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration);
}

// 購入音：ピロリン（ゲーム風コイン）
async function playCoinSound(){
  await initAudio();
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
  osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08);

  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

// エメラルド発見音：上昇アルペジオ（レア感）
async function playEmeraldSound(){
  await initAudio();
  const now = audioCtx.currentTime;
  [880, 1108, 1318, 1760].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, now + i * 0.05);
    g.gain.setValueAtTime(0, now + i * 0.05);
    g.gain.linearRampToValueAtTime(0.2, now + i * 0.05 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.4);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now + i * 0.05);
    osc.stop(now + i * 0.05 + 0.4);
  });
}

// ボタン選択音：ピコ（汎用ボタンSE）
async function playSelectSound(){
  await initAudio();
  const t = audioCtx.currentTime;
  const partials = [
    { ratio: 1,    vol: 1.0,  decayMult: 1.0  },
    { ratio: 3.73, vol: 0.4,  decayMult: 0.55 },
    { ratio: 7.8,  vol: 0.12, decayMult: 0.25 },
  ];
  const freq  = 1100;
  const decay = 0.3;
  const vol   = 0.25;
  partials.forEach(({ ratio, vol: v, decayMult }) => {
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq * ratio * 1.004, t);
    osc.frequency.exponentialRampToValueAtTime(freq * ratio, t + 0.012);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol * v, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay * decayMult);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + decay * decayMult + 0.05);
  });
}

// ダメージ音：ドスッ（鈍器系打撃）
async function playDamageBlunt(){
  await initAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
  const bufferSize = audioCtx.sampleRate * 0.1;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  const nGain = audioCtx.createGain();
  noise.buffer = noiseBuffer;
  nGain.gain.setValueAtTime(0.2, t);
  nGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
  osc.connect(g); g.connect(audioCtx.destination);
  noise.connect(nGain); nGain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.2);
  noise.start(t);
}

// --- モーダル基盤（共通） ---
function showModal(message, opts){
  let overlay = document.getElementById("modal-overlay");
  document.getElementById("modal-message").innerHTML = message;
  let yesBtn = document.getElementById("modal-yes");
  let noBtn  = document.getElementById("modal-no");
  // 古いリスナー除去のためclone
  let newYes = yesBtn.cloneNode(true);
  let newNo  = noBtn.cloneNode(true);
  yesBtn.parentNode.replaceChild(newYes, yesBtn);
  noBtn.parentNode.replaceChild(newNo, noBtn);

  if(opts.alertOnly){
    newNo.style.display = "none";
    newYes.innerText = "OK";
  } else {
    newNo.style.display = "";
    newYes.innerText = "はい";
  }

  overlay.classList.add("show");
  newYes.onclick = () => {
    overlay.classList.remove("show");
    if(opts.onYes) opts.onYes();
  };
  newNo.onclick = () => {
    overlay.classList.remove("show");
    if(opts.onNo) opts.onNo();
  };
}

function showAlert(message){
  showModal(message, { alertOnly: true });
}

function showConfirm(message, onYes){
  showModal(message, { onYes });
}

// 解放済み紋IDセット（localStorageから読み込み）
const UNLOCKED_CRESTS = new Set(JSON.parse(localStorage.getItem("unlockedCrests") || "[]"));

// 解放条件判定（必要に応じて条件を追加）
const UNLOCK_CHECKS = {
  beginner:     () => state.bestFloor >= 10,
  mining:       () => state.bestFloor >= 50,
  steel:        () => state.bestFloor >= 50,
  detect:       () => state.bestFloor >= 50,
  friend:       () => state.stats.daigo >= 15,
  skilldig:     () => state.stats.veinClears >= 1,
  potion_boost: () => state.stats.potions >= 50,
  gamble_shield: () => state.stats.youki >= 1,
  // 他の紋は今後追加
};

// 解放チェック：新規解放されたIDの配列を返す
function checkUnlocks(){
  let newlyUnlocked = [];
  for(let id in UNLOCK_CHECKS){
    if(!UNLOCKED_CRESTS.has(id) && UNLOCK_CHECKS[id]()){
      UNLOCKED_CRESTS.add(id);
      newlyUnlocked.push(id);
    }
  }
  if(newlyUnlocked.length > 0){
    localStorage.setItem("unlockedCrests", JSON.stringify([...UNLOCKED_CRESTS]));
  }
  return newlyUnlocked;
}

function saveAll() {
  localStorage.setItem("totalScrap",   state.totalScrap);
  localStorage.setItem("totalEmerald", state.totalEmerald);
  localStorage.setItem("upgrades",     JSON.stringify(state.upgrades));
  localStorage.setItem("bestFloor",    state.bestFloor);
  localStorage.setItem("items",        JSON.stringify(state.items));
  localStorage.setItem("stats",        JSON.stringify(state.stats));
  localStorage.setItem("playerName",   state.name);
  localStorage.setItem("unlockedItems", JSON.stringify(state.unlockedItems));
}

// ランの統計を永続に加算してリセット
function commitStats(died, carry=0){
  state.stats.runs++;
  if(died) state.stats.deaths++;
  // RUN_STATS_FIELDS の各フィールドを runStats から stats へ加算
  // ただし scrap だけは「持ち帰った量(carry)」を加算する特殊ケース
  RUN_STATS_FIELDS.forEach(f => {
    if(f === "scrap") state.stats.scrap += carry;
    else              state.stats[f]    += state.runStats[f];
  });
  resetRunStats();
  // ★採掘便り：ラン終了したので次回の便り読込を解禁
  resetLetterRead();
}

// --- コスト ---
function getHpCost()      { return Math.floor(50  + state.upgrades.hp    * state.upgrades.hp    * 2); }
function getPowerCost()   { return Math.floor(100 + state.upgrades.power * state.upgrades.power * 3); }
function getPotionHealCost() { return Math.floor(1500 * Math.pow(1.55, state.upgrades.potionHeal)); }

// --- HP処理 ---
// 諸盾の紋（gamble_shield）など、ダメージ値を変動させる紋があるため、
// damage() は適用後の実ダメージを返す。ログ表示などで利用する側はこの戻り値を使うこと。
// ダメージ処理
// d           : 元ダメージ量
// nonPhysical : 物理ダメージかどうか。true なら鋼皮の紋とガードバフを無視する
//               （毒・自傷・将来の特殊ダメージなど、防具・盾で防げないダメージ用）
function damage(d, nonPhysical=false){
  // 諸盾の紋：50%でダメージ無効、50%で2倍（最初に適用）
  if(state.relics.some(r => r.id === "gamble_shield")){
    if(Math.random() < 0.5){
      d = 0;
    } else {
      d = d * 2;
    }
  }
  // 🛡️ ガードバフ：物理ダメージを完全無効化（諸盾の後、鋼皮の前）
  // 0ダメでも2倍でも、ダメージイベントが発生した時点で1回消費する仕様
  // ガード発動時は鋼皮の紋の最低1保証もスキップして、確実に0ダメージにする
  let guardActivated = false;
  if(!nonPhysical){
    let guard = state.buffs.find(b => b.id === "guard");
    if(guard){
      d = 0;
      consumeBuffUse("guard");
      addLog("🛡️ ガードでダメージを無効化した！", "sub");
      guardActivated = true;
    }
  }
  // 鋼皮の紋：物理ダメージを2軽減（最低1）。ただしガード発動時はスキップ
  if(!nonPhysical && !guardActivated && state.relics.some(r => r.id === "steel")){
    d = Math.max(1, d - 2);
  }
  let actual = Math.min(d, state.hp);
  state.hp = Math.max(0, state.hp - d);
  state.runStats.damage += actual;
  return d;
}
function heal(v)  { state.hp = Math.min(state.maxHp, state.hp + v); }

// --- ログテキスト色付け ---
function colorizeLog(text, type){
  // アイテム名を黄緑に
  Object.values(ITEM_DEF).forEach(def => {
    text = text.split(def.name).join(
      `<span style="color:#aaffaa;font-weight:bold;">${def.name}</span>`);
  });
  // ダメージ数値を赤に（「X ダメージ」）
  text = text.replace(/(\d+)( ダメージ)/g,
    '<span style="color:#f55;font-weight:bold;">$1</span>$2');
  // スクラップ数値をオレンジに（「スクラップ +X」の形のみ）、前にSVGアイコン挿入
  text = text.replace(/(スクラップ )(\+[\d,]+)/g,
    `$1${SVG_ICONS.scrap}<span style="color:#ffcc66;font-weight:bold;">$2</span>`);
  // エメラルド数値を緑に
  text = text.replace(/(エメラルド )(\+[\d,]+)/g,
    `$1${SVG_ICONS.emerald}<span style="color:#58d68d;font-weight:bold;">$2</span>`);
  // HP回復を黄緑に（全タイプ共通）
  text = text.replace(/(HP\+\d+|HP \+\d+)/g,
    '<span style="color:#aaff66;font-weight:bold;">$1</span>');
  // 単独のスクラップ数値（マイナス時など、+なしのもの）をオレンジに
  text = text.replace(/スクラップ ([\d,]+)(?![\d])/g,
    'スクラップ <span style="color:#ffcc66;font-weight:bold;">$1</span>');
  return text;
}

// --- 絵文字取得 ---
function getEmoji(text, type){
  // テキスト優先チェック（型より先に）
  if(text.includes("金モグラ"))        return SVG_ICONS.goldenMole;
  if(text.includes("泥棒モグラ"))      return SVG_ICONS.thiefMole;
  if(text.includes("陽キャ") || text.includes("あざす") || text.includes("お腹痛")) return SVG_ICONS.youki;
  if(text.includes("深い縦穴") || text.includes("ジャンプ") || text.includes("迂回")) return SVG_ICONS.pitJump;
  if(type==="divider")     return text.includes("女神") ? SVG_ICONS.goddess : SVG_ICONS.door;
  if(type==="damage")      return text.includes("毒") ? SVG_ICONS.poison : "💥";
  if(type==="scrap")       return SVG_ICONS.pickaxe;
  if(text.includes("一休み"))       return SVG_ICONS.campfire;
  if(type==="heal")        return "💤";
  if(type==="loss")        return "🕳️";
  if(type==="sub")         return "";
  if(text.includes("採掘開始"))     return SVG_ICONS.pickaxe;
  if(text.includes("コンテナ"))     return "📦";
  if(text.includes("鉱脈"))         return SVG_ICONS.vein;
  if(text.includes("キノコ"))       return SVG_ICONS.mushroom;
  if(text.includes("帰還"))         return "🏠";
  if(text.includes("HPが0"))        return "💀";
  if(text.includes("亀裂"))         return "🕳️";
  if(text.includes("有毒ガス"))      return "🌫️";
  if(text.includes("暗闇で岩"))      return "🪨";
  if(text.includes("足を滑らせ"))    return "🧊";
  if(text.includes("手首を痛め"))    return "🤕";
  if(text.includes("コウモリ"))     return "🦇";
  if(text.includes("女神"))         return SVG_ICONS.goddess;
  if(text.includes("加護"))          return SVG_ICONS.goddess;
  if(text.includes("DAIGO"))         return "👤";
  if(text.includes("商人"))          return SVG_ICONS.merchant;
  return "📋";
}

// --- ログ ---
// state.log = [ { floor, lines: [{text, type, emoji}] }, ... ]
// subはその階の最新エントリのlinesに追加、それ以外は新エントリ

function addLog(text, type="normal"){
  let emoji = getEmoji(text, type);

  if(type === "sub"){
    // 最新エントリのlinesに追加
    if(state.log.length > 0){
      state.log[0].lines.push({text, type, emoji});
    }
    return;
  }

  // 新しい階層エントリを先頭に追加
  let entry = {
    floor: state.floor,
    type,           // エントリ全体の代表タイプ（アイコン・色に使う）
    lines: [{text, type, emoji}]
  };
  state.log.unshift(entry);
  state.log = state.log.slice(0, 10); // 10階層分保持
}

// フロアバッジHTML生成
function floorBadgeHTML(floor){
  let extra = "";
  if(floor % 30 === 0)                                        extra = "floor-goddess";
  else if(floor % 10 === 0)                                   extra = "floor-return";
  else if(floor === 15 || (floor > 1 && (floor-1) % 50 === 0)) extra = "floor-relic";
  // 中断可能タイミング（exploreモード）かつテント所持時、階層バッジ右隣（バッジ外）に小さくテント表示
  let tentMark = "";
  if(state.upgrades && state.upgrades.tent && canSuspend()){
    let smallTent = SVG_ICONS.tent
      .replace('width:1.4em;height:1.4em;', 'width:1.1em;height:1.1em;')
      .replace('vertical-align:-0.3em;', 'vertical-align:-0.2em;');
    tentMark = `<span style="font-size:28px;opacity:0.85;vertical-align:middle;">${smallTent}</span>`;
  }
  return `<div class="floor-badge ${extra}">${floor}F</div>${tentMark}`;
}

// --- ステータスグリッド更新 ---
// HP/SCRAP/EMERALD/FLOOR の値・色・HPバーを更新する。
// render() から呼ばれる。state を参照し対象DOMに書き込むだけで戻り値はない。
function renderStatusGrid(){
  let sgHp = document.getElementById("sg-hp");
  if(sgHp){
    let ratio = state.maxHp > 0 ? state.hp / state.maxHp : 0;
    let hpC = ratio > 0.75 ? "#00ff50"
            : ratio > 0.50 ? "#ddff00"
            : ratio > 0.25 ? "#ff9900"
            : "#ff3333";
    sgHp.innerHTML = `<span style="font-size:14px;color:rgba(0,255,80,0.45);letter-spacing:2px;">HP</span>　${state.hp}<span class="stat-sub">/${state.maxHp}</span>`;
    sgHp.style.color = hpC;
    sgHp.style.textShadow = `0 0 10px ${hpC}88`;
    let bar = document.getElementById("sg-hp-bar");
    if(bar){
      bar.style.width = Math.round(ratio * 100) + "%";
      let barColor = ratio > 0.75 ? "linear-gradient(90deg,#00c844,#00ff50)"
                   : ratio > 0.50 ? "linear-gradient(90deg,#b8cc00,#ddff00)"
                   : ratio > 0.25 ? "linear-gradient(90deg,#cc6600,#ff9900)"
                   : "linear-gradient(90deg,#aa1111,#ff3333)";
      bar.style.background = barColor;
      bar.style.boxShadow  = `0 0 6px ${hpC}`;
    }
  }
  let sgScrap = document.getElementById("sg-scrap");
  if(sgScrap) sgScrap.textContent = state.scrap.toLocaleString();
  let sgEm = document.getElementById("sg-emerald");
  if(sgEm) sgEm.textContent = (state.emerald || 0).toLocaleString();
  let sgFloor = document.getElementById("sg-floor");
  if(sgFloor) sgFloor.textContent = state.floor + "F";
}

const BTN_STYLES = {
  main:    { color: "#0f0",    bg: "rgba(0,255,0,0.1)" },
  risk:    { color: "#ffcc66", bg: "rgba(255,204,102,0.1)" },
  skip:    { color: "#aaa",    bg: "rgba(255,255,255,0.05)" },
  danger:  { color: "#f55",    bg: "rgba(245,85,85,0.1)" },

  shop:    { color: "#f9f",    bg: "rgba(255,153,255,0.1)" },
};

function btn(t, f, style="main", seName="select"){
  let b = document.createElement("button");
  b.innerText = t;
  b.onclick   = () => { if(seName) playSE(seName); f(); };
  let s = BTN_STYLES[style] || BTN_STYLES.main;
  b.style.borderColor = s.color;
  b.style.color       = s.color;
  b.style.background  = s.bg;
  b.style.boxShadow   = `0 0 10px ${s.color}66`;
  document.getElementById("actions").appendChild(b);
}

  const descColors = {"採取系":"#ffdddd","防御系":"#ddfbff","リスク系":"#fff5dd","コンボ系":"#ffeeff","ユーティリティ系":"#dfffdf"};

  let html = `<div style="padding:8px 16px;">`;
  categories.forEach(cat => {
    let crests = CREST_MASTER.filter(c => c.category === cat);
    html += `<div style="color:${catColors[cat]};font-size:28px;margin:16px 0 8px;border-bottom:1px solid rgba(255,255,255,0.15);padding-bottom:6px;font-weight:bold;">[ ${cat} ]</div>`;
    crests.forEach(c => {
      let unlocked = UNLOCKED_CRESTS.has(c.id);
      let cardSvg = `<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" style="width:80px;height:112px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(${c.rgb},0.5));">

        <g style="color:${c.color};">${c.svg}</g>

        <text x="50" y="80" text-anchor="middle" font-size="44" fill="#666">🔒</text>` : ""}
      </svg>`;
      html += `<div style="display:flex;align-items:center;gap:16px;margin:10px 0;padding:12px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;">
        ${cardSvg}
        <div style="flex:1;">
          <div style="color:${unlocked ? c.color : "#666"};font-size:28px;font-weight:bold;">${c.name}</div>
          <div style="color:${descColors[cat]};font-size:22px;margin-top:6px;line-height:1.4;">${c.desc}<br><span style="color:${c.unlockCond === "未実装" ? "#666" : "#fff"};font-size:20px;">　解放条件：${c.unlockCond}</span></div>
        </div>

    });

  html += `</div>`;

// ============================================
// アイテムメニュー（モーダル）
// ============================================
// 旧仕様（state.mode="item" でactions領域に展開）からモーダル化に変更。
// prevMode/openItemMenu/closeItemMenu の状態管理は廃止し、
// 現在のmodeを問わずモーダルだけ開閉する。

// アイテム1行を表すHTML文字列を組み立てる共通関数。
// 通常メニュー（モーダル）と満タン時イベント（actions領域）の両方で使う。
//   item    : アイテムオブジェクト { name, effect } または null（空きスロット）
//   index   : 一覧上のインデックス
//   opts    : {
//     showNumber:    true なら "1. " のような番号を表示（通常メニュー）
//     useEnabled:    "使う" ボタンを有効にするか
//     useHandler:    "使う" 押下時の onclick 属性文字列（例 "useItemFromModal(0)"）
//     discardEnabled:"捨てる" ボタンを有効にするか
//     discardHandler:"捨てる" 押下時の onclick 属性文字列
//     newBadge:      true なら NEW バッジを名前の横に表示（満タン時イベント用）
//   }
function buildItemRowHTML(item, index, opts){
  // 空きスロット
  if(!item){
    const numLabel = opts.showNumber ? `${index+1}. ` : "";
    return `
      <div style="display:flex;align-items:center;gap:8px;width:100%;margin:6px 0;padding:6px 0;">
        <div style="flex:1;font-size:22px;color:#444;">${numLabel}────</div>
        <div style="flex:0 0 220px;"></div>
      </div>
    `;
  }
  const def = ITEM_DEF[item.effect];
  const descText = def ? def.desc : "";
  const numLabel = opts.showNumber ? `${index+1}. ` : "";
  const newBadge = opts.newBadge ? ' <span style="color:#0ff;font-size:18px;">NEW</span>' : "";

  // 「使う」ボタン
  const useStyle = `min-width:78px;font-size:20px;padding:8px 0;border-color:#0ff;color:#0ff;background:rgba(0,255,255,0.1);` +
                   (opts.useEnabled ? "" : "opacity:0.4;");

  // 「捨てる」ボタン
  const discardStyle = `min-width:78px;font-size:20px;padding:8px 0;border-color:#f55;color:#f55;background:rgba(245,85,85,0.1);` +
                       (opts.discardEnabled ? "" : "opacity:0.4;");
  const discardAttr  = opts.discardEnabled ? `onclick="${opts.discardHandler}"` : `disabled`;

  return `
    <div style="display:flex;align-items:center;gap:8px;width:100%;margin:6px 0;padding:6px 0;border-bottom:1px solid rgba(0,255,0,0.15);">

        <div style="font-size:16px;color:#888;margin-top:2px;">${descText}</div>

}

// モーダル内のHTMLを組み立てる
function buildItemMenuHTML(){
  const heading = `<div style="font-size:26px;color:#fef3c7;margin-bottom:16px;">[ 持ち物 ]</div>`;

  // ホーム時は「使う」不可、それ以外は「使う」可（個別のusableModesも見る）
  const isHome = state.mode === "home";

  // 5枠ぶん描画（空きも含む）
  let rowsHTML = "";
  for(let i = 0; i < 5; i++){
    const item = state.items[i];
    let useEnabled = false;
    if(item){
      const def = ITEM_DEF[item.effect];
      const modeUsable = !def || !def.usableModes || def.usableModes.includes(state.mode);
      useEnabled = !isHome && modeUsable;
    }
    rowsHTML += buildItemRowHTML(item, i, {
      showNumber: true,
      useEnabled: useEnabled,
      useHandler: `useItemFromModal(${i})`,
      discardEnabled: !!item,    // 空きスロットは「捨てる」も無効
      discardHandler: `discardItemFromModal(${i})`,
    });
  }

  // 全部空のときは案内文を中央に
  if(state.items.length === 0){
    rowsHTML = `<div style="font-size:20px;color:#888;text-align:center;padding:24px 0;">持ち物はない</div>`
             + rowsHTML;  // 空欄も下に表示しておく
  }

  return heading + rowsHTML;
}

// モーダル上から「使う」を押したときの処理
// 既存の useItem(index) を呼ぶ前にモーダルを閉じる
function useItemFromModal(index){
  // モーダルを閉じる
  document.getElementById("modal-overlay").classList.remove("show");
  useItem(index);
}

// モーダル上から「捨てる」を押したときの処理
// 既存の discardItem は showConfirm を内部で呼ぶので、
// 先にこっちのモーダルを閉じてから discardItem を呼ぶ。
function discardItemFromModal(index){
  document.getElementById("modal-overlay").classList.remove("show");
  discardItem(index);
}

function useItem(index){
  let item = state.items[index];
  let def  = ITEM_DEF[item.effect];
  if(!def){ return; }

  // 効果発動（共通処理）
  applyItemEffect(item);

  // 消費して上詰め
  state.items.splice(index, 1);
  saveAll();
  render();
}

function discardItem(index){
  let item = state.items[index];
  showConfirm(`「${item.name}」を本当に捨てますか？`, () => {
    state.items.splice(index, 1);
    saveAll();
    render();
  });
}

  state.floor = 1;

// --- 採掘量計算 ---
function calcScrap(){
  let bonus    = Math.floor((state.floor-1)/10) + 1;
  let base     = state.power * bonus;
  let variance = Math.floor(base * (Math.random() - 0.5) * 0.14);  // ±7%
  return Math.max(1, base + variance);
}

// --- 採掘倍率計算 ---
function getMiningMultiplier(){
  // バフ・デバフの effects.miningMultiplier を全部掛け合わせる
  return state.buffs
    .filter(b => b.effects && b.effects.miningMultiplier != null)
    .reduce((mult, b) => mult * b.effects.miningMultiplier, 1);
}

// 採掘便り本体：他の坑夫の最新墓データを表示するモーダル
// 開いた瞬間に Cloudflare から最新データを取りに行く（letterRead フラグで連打防止）。
// 通信前後で modal-message の中身を動的に書き換える。
function openJournalModal(){
  if(!state.upgrades.journal) return;

  // 1) 先に「読込中」の状態でモーダルを表示
  showModal(buildLetterHTML("loading"), { alertOnly: true });

  // 2) 非同期で取得 → モーダルの中身を結果に差し替え
  fetchLatestLetter().then(result => {
    const msgEl = document.getElementById("modal-message");

// 採掘便りモーダルの中身HTMLを組み立てる
// state: "loading" | "updated" | "skipped_self" | "skipped_same" | "throttled" | "empty" | "error"
function buildLetterHTML(status){
  const heading = `<div style="font-size:26px;color:#fef3c7;margin-bottom:16px;">[ 採掘便り ]</div>`;

  if(status === "loading"){
    return heading +
      `<div style="font-size:22px;color:#888;text-align:center;padding:24px 0;">便りを取り寄せています…</div>`;
  }

  // 現在保存中の便り（あれば）
  let current = null;
  try {
    const raw = localStorage.getItem("currentLetter");
    if(raw) current = JSON.parse(raw);
  } catch(e){ /* 無視 */ }

  // 通信エラー時
  if(status === "error"){
    let body = `<div style="font-size:20px;color:#f88;text-align:center;padding:12px 0;">便りを更新できませんでした</div>`;
    if(current){
      body += `<div style="font-size:18px;color:#888;text-align:center;margin-bottom:8px;">― 前回の便り ―</div>`;
      body += renderGrave(current);
    }
    return heading + body;
  }

  // まだ誰も死んでない
  if(status === "empty"){
    return heading +
      `<div style="font-size:20px;color:#888;text-align:center;padding:24px 0;">便りはまだ届いていない…</div>`;
  }

  // 更新成功 or 同じ便り or 自分の便り or 連打抑制
  // どれも「現在の便り」を表示すればよい
  if(current){
    let body = renderGrave(current);
    // 「自分の便り」のときは小さくヒント表示
    if(status === "skipped_self"){
      body += `<div style="font-size:16px;color:#666;text-align:center;margin-top:12px;">（最新は あなた自身 でした）</div>`;
    }
    return heading + body;
  }

  // ここに来るのは「currentが無くて status が何か」というレアケース（自分の便りスキップなど）
  return heading +
    `<div style="font-size:20px;color:#888;text-align:center;padding:24px 0;">便りはまだ届いていない…</div>`;
}

// 個別の墓データを表示するHTML片を組み立てる
function renderGrave(grave){
  // アイテム effect → 表示名
  let itemLabel = "―";
  if(grave.item){
    if(ITEM_DEF[grave.item] && ITEM_DEF[grave.item].name){
      itemLabel = ITEM_DEF[grave.item].name;
    } else {
      // 未知のeffect（将来追加されたものなど）：何かは落としていることだけ伝える
      itemLabel = "見覚えのないもの";
    }
  } else {
    // アイテムなし：スクラップ1%が代替報酬
    const scrapDrop = Math.floor((grave.scrap || 0) * 0.01);
    itemLabel = `スクラップ ${scrapDrop.toLocaleString()}`;
  }
  const safeName = String(grave.name || "名もなき坑夫").replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
  return `
    <div style="font-size:22px;color:#fef3c7;text-align:center;line-height:1.8;padding:12px 0;">
      <div><span style="color:#fff;">${safeName}</span> は</div>
      <div><span style="color:#fbbf24;">${grave.floor}階</span> で息絶えた</div>
      <div style="font-size:18px;color:#aaa;margin-top:8px;">遺品：${itemLabel}</div>
    </div>
  `;
}

// テントアイコンタップ：ホーム時は無反応、採掘中は中断 or 中断不可吹き出し
function onTentTap(ev){
  if(ev) ev.stopPropagation();
  if(!state.upgrades.tent) return;
  if(state.mode === "home" || state.mode === "result") return;  // ホーム時は無反応

  if(canSuspend()){
    // 中断実行
    suspendRun();
  } else {
    // 中断不可吹き出し
    showTentTooltip("今は中断できません");
  }
}

// --- 中断・再開機能 ---
function suspendRun(){
  let data = {
    floor: state.floor,
    maxFloorThisRun: state.maxFloorThisRun,
    hp: state.hp,
    maxHp: state.maxHp,
    power: state.power,
    scrap: state.scrap,
    emerald: state.emerald,
    items: state.items,
    relics: state.relics,
    buffs: state.buffs,
    runStats: state.runStats,
    relicEventFloors: [...state.relicEventFloors],
    goddessUsedFloors: [...state.goddessUsedFloors],
    daigoLastFloor: state.daigoLastFloor,
    merchantLastFloor: state.merchantLastFloor,
    pitJumpLastFloor: state.pitJumpLastFloor,
    moleBlock: state.moleBlock,
    mushroomBad: state.mushroomBad,
    veinDepth: state.veinDepth,
    veinLastGain: state.veinLastGain,
    veinLastEmerald: state.veinLastEmerald
  };
  localStorage.setItem("suspendedRun", JSON.stringify(data));
  // ホームに戻す（ログはクリア）→ そのまま再開オーバーレイを表示
  goHome();
  showResumeOverlayIfNeeded();
}

// 再開：中断データから state を復元して採掘モードへ
function resumeRun(){
  let raw = localStorage.getItem("suspendedRun");
  if(!raw) return;
  let data;
  try { data = JSON.parse(raw); } catch(e){ localStorage.removeItem("suspendedRun"); return; }

  // 中断データを復元（再開した時点で必ず破棄）
  localStorage.removeItem("suspendedRun");

  state.floor = data.floor;
  state.maxFloorThisRun = data.maxFloorThisRun ?? data.floor;
  state.hp = data.hp;
  state.maxHp = data.maxHp;
  state.power = data.power;
  state.scrap = data.scrap;
  state.emerald = data.emerald;
  state.items = data.items;
  state.relics = data.relics;
  // バフ復元：旧フォーマット（miningBonus/miningPenalty を直接持つ）から
  // 新フォーマット（effects.miningMultiplier）へ自動移行する
  state.buffs = (data.buffs || []).map(b => {
    if(b.effects) return b; // 既に新フォーマット
    // 旧フォーマットを変換
    let newBuff = {
      id: b.id,
      name: b.name,
      isBad: b.isBad,
      turns: b.turns,
      consumeOn: "turn",
      effects: {},
      onTurn: null
    };
    if(b.miningBonus)   newBuff.effects.miningMultiplier = (1 + b.miningBonus);
    if(b.miningPenalty) newBuff.effects.miningMultiplier = b.miningPenalty;
    // 毒の onTurn はBUFF_DEFから再生
    if(BUFF_DEF[b.id] && BUFF_DEF[b.id].onTurn){
      newBuff.onTurn = BUFF_DEF[b.id].onTurn;
    }
    return newBuff;
  });
  state.runStats = data.runStats;
  state.relicEventFloors = new Set(data.relicEventFloors);
  state.goddessUsedFloors = new Set(data.goddessUsedFloors || []);
  state.daigoLastFloor = data.daigoLastFloor;
  state.merchantLastFloor = data.merchantLastFloor;
  state.pitJumpLastFloor = data.pitJumpLastFloor ?? -999;
  state.moleBlock = data.moleBlock;
  state.mushroomBad = data.mushroomBad;
  state.veinDepth = data.veinDepth;
  state.veinLastGain = data.veinLastGain;
  state.veinLastEmerald = data.veinLastEmerald;
  state.log = [];
  state.lastResult = null;
  state.activeCrestId = null;
  state.relicViewOpen = false;
  state.mode = "explore";

  addLog("休憩おわり、冒険を再開しよう");
  hideResumeOverlay();
  render();
}

// --- エメラルドドロップ確率 ---
function getEmeraldDropRate(){
  if(state.floor < 30) return 0;
  return Math.min(0.135, Math.floor((state.floor - 30) / 10) * 0.005); // 0.5%ずつ増加、上限13.5%
}

// --- 階層補正ヘルパー ---
function floorDmgBonus()  { return Math.floor(state.floor / 10); }
function floorHealBonus() { return Math.floor(state.floor / 20); }

// --- イベント発生条件マスタ ---
function EVENT_COND(){
  return {
    lowHp:      state.hp / state.maxHp <= 0.25,
    highHp:     state.hp / state.maxHp >= 0.75,
    isPoisoned: state.buffs.some(b => b.id === "poison"),
    miningUp:   state.buffs.some(b => b.id === "miningUp"),
    miningDown: state.buffs.some(b => b.id === "miningDown"),
    itemEmpty:  state.items.length === 0,
    itemFull:   state.items.length >= 5,
    hasPotion:  state.items.some(i => i.effect === "hp3"),
    richScrap:  state.scrap >= 200,
    poorScrap:  state.scrap === 0,
    hasEmerald: state.emerald > 0,
  };
}

// --- イベント抽選用コンテキスト ---
// 各イベントの condition 関数に渡される。state直アクセスより読みやすく、
// 将来テストや特殊ロジック追加時にも扱いやすい。
function buildEventCtx(){
  return {
    state,                                                  // state全体への参照
    floor:    state.floor,                                  // 現在階層
    cond:     EVENT_COND(),                                 // 派生条件まとめ
    hasRelic: id => state.relics.some(r => r.id === id),    // 紋装備中か
    hasItem:  effect => state.items.some(i => i.effect === effect), // 特定効果アイテム所持中か
  };
}

// --- 重み付きイベント抽選 ---
// condition を満たすイベントだけを対象に重み付き抽選する。
// 全件 condition 不一致なら、condition 無しのイベントだけで抽選（fallback）。
function pickWeightedEvent(events, ctx){
  let avail = events.filter(e => !e.condition || e.condition(ctx));
  if(avail.length === 0) avail = events.filter(e => !e.condition);
  let total = avail.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for(let e of avail){
    r -= e.weight;
    if(r <= 0) return e;
  }
  return avail[avail.length - 1];
}

function isSpecialFloor(f){
  if(f % 30 === 0) return true; // 女神像
  if(f === 15) return true;     // 紋階（初回）
  if(f > 1 && (f - 1) % 50 === 0) return true; // 紋階（51, 101, 151...）
  return false;
}

// isAvailable() が false ならその階の通常イベント抽選が走る（同階では再抽選しない）。
const FIXED_FLOOR_EVENTS = [
  {

// --- 探索 ---
function next(){
  state.floor++;
  state.runStats.floors++;
  if(state.floor > state.maxFloorThisRun) state.maxFloorThisRun = state.floor;

  // 毒中間モード用フラグをクリア
  state.poisonTickedThisTurn = false;

  // バフ・デバフのターン処理（階層上昇時）
  tickBuffs();
  if(state.hp <= 0){ checkDeath(); render(); return; }

  // 毒ダメージが発生した場合は中間モードへ。プレイヤーが「進む」ボタンを押すまで
  // 次のイベント抽選・特殊階判定を行わない。
  if(state.poisonTickedThisTurn){
    state.mode = "poison_tick";
    render();
    return;
  }

  proceedAfterTick();
}

// next() のうち、tickBuffs後のイベント抽選〜特殊階判定部分。
// 毒ダメージ後の中間モードからも呼ばれる。
function proceedAfterTick(){
  // mode は "poison_tick" から呼ばれる可能性があるため、必ず通常モードに戻しておく。
  // 各イベントが必要に応じて event_* モードに切り替える。
  state.mode = "explore";

  // 紋獲得イベント：15階 または 51,101,151...階
  let isRelicFloor = state.floor === 15 || (state.floor > 1 && (state.floor - 1) % 50 === 0);
  if(isRelicFloor && !state.relicEventFloors.has(state.floor)){
    state.relicEventFloors.add(state.floor);
    let pool = CREST_MASTER.filter(c =>
      UNLOCKED_CRESTS.has(c.id) &&
      !state.relics.some(r => r.id === c.id)
    );
    if(pool.length > 0){
      let shuffled = [...pool].sort(() => Math.random() - 0.5);
      state.relicChoices = shuffled.slice(0, 3);
      state.mode = "event_relic_pick";
      let msg = state.floor === 15
        ? "深淵に挑みし者よ…紋をその身に纏い、奈落を目指せ"
        : "紋を発見した！";
      addLog(msg);
      render();
      return;
    }
  }

  if(state.floor % 30 === 0){
    if(state.goddessUsedFloors.has(state.floor)){
      addLog(`－－－ ${state.floor}階層 －－－\n女神は沈黙している…`, "divider");
      state.mode = "explore";
      render();
      return;
    }
    addLog(`－－－ ${state.floor}階層 －－－\n女神像がある…`, "divider");
    state.mode = "event_goddess";
    render();
    return;
  }

  if(state.floor % 10 === 0){
    addLog(`－－－ ${state.floor}階層 －－－\nスクラップを半分支払えば帰還できそうだ`, "divider");
    state.mode = "return";
    render();
    return;
  }

  // 階確定イベント（鉄扉・女神像の特殊階の後、通常イベント抽選の前）
  for(const fe of FIXED_FLOOR_EVENTS){
    if(fe.floor === state.floor && fe.isAvailable()){
      fe.fn();
      render();
      return;
    }
  }

  // --- 軽(70%) / 重(30%) の2段階抽選 ---
  // イベント比率定数（紋や仕様変更で調整可能）
  const hasDetect = state.relics.some(r => r.id === "detect");
  const RATE_MINING = hasDetect ? 0.30 : 0.40;
  const RATE_LIGHT  = hasDetect ? 0.20 : 0.30;
  const RATE_HEAVY  = hasDetect ? 0.50 : 0.30;

  const roll = Math.random();
  const ctx  = buildEventCtx();

  if(roll < RATE_MINING){
    // 採掘イベント（固定）
    (() => {
      let g = Math.floor(calcScrap() * getMiningMultiplier());
      // 初心の紋：+1固定加算
      if(state.relics.some(r => r.id === "beginner")) g += 1;
      // 採掘の紋：1.1倍（切り上げ）
      if(state.relics.some(r => r.id === "mining")){
        g = Math.ceil(g * 1.1);
      }
      // 低HP（25%以下）時：15%の確率で採掘ペナルティ（スクラップ30%減）
      let lowHpPenalty = EVENT_COND().lowHp && Math.random() < 0.15;
      if(lowHpPenalty){
        let penalty = Math.floor(g * 0.3);
        g -= penalty;
      }
      state.scrap += g;
      // エメラルドドロップ判定
      let dropRate = getEmeraldDropRate();
      if(dropRate > 0 && Math.random() < dropRate){
        state.emerald++;
        state.runStats.emerald++;
        playSE("emerald");
        addLog(`採掘した スクラップ +${g.toLocaleString()} エメラルド +1`, "scrap");
      } else {
        playSE("dig");
        addLog(`採掘した スクラップ +${g.toLocaleString()}`, "scrap");
      }
      if(lowHpPenalty){
        addLog(`疲れて採掘が捗らない…`, "sub");
      }
      // 高HP（75%以上）時：15%の確率で採掘ボーナス
      if(EVENT_COND().highHp && Math.random() < 0.15){
        let bonus = Math.max(1, Math.floor(g * 0.3));
        state.scrap += bonus;
        addLog(`採掘の調子が良い！追加 スクラップ +${bonus.toLocaleString()}`, "sub");
      }
    })();
    checkDeath();
    render();
  } else if(roll < RATE_MINING + RATE_LIGHT){
    // 軽イベント抽選
    let ev = pickWeightedEvent(LIGHT_EVENTS, ctx);
    ev.fn();
    checkDeath();
    render();
  } else {
    // 重イベント抽選
    let ev = pickWeightedEvent(HEAVY_EVENTS, ctx);
    ev.fn();
    if(state.mode !== "explore"){ render(); return; }
    checkDeath();
    render();
  }
}

    if(state.items.length < 5){
      state.items.push(newItem);
      saveAll();
      addLog("ポーションを発見！", "sub");
      state.mode = "explore";
    } else {
      state.pendingItem = newItem;
      addLog("ポーションを発見！ でも手持ちがいっぱいだ…", "sub");
      state.mode = "event_item_full";
    }

// --- 手持ちいっぱい：アイテム選択破棄 ---
function renderItemFullEvent(){
  let a = document.getElementById("actions");
  let allItems = [...state.items, state.pendingItem]; // 手持ち5個＋新規1個

  let label = document.createElement("div");
  label.style.cssText = "color:#aaa;font-size:22px;margin:4px 8px;width:100%;text-align:center;";
  label.innerText = "持ち物がいっぱい！ 使うか、捨てるアイテムを選んでください";
  a.appendChild(label);

  // 一旦コンテナを作り、共通関数のHTML文字列をまとめて挿入
  let container = document.createElement("div");
  container.style.cssText = "width:100%;";
  let html = "";
  allItems.forEach((item, i) => {
    const isNew = (i === allItems.length - 1);
    // 採掘中限定で出るイベントなので「使う」は基本可能（個別のusableModesは見る）
    const def = item ? ITEM_DEF[item.effect] : null;
    const modeUsable = !def || !def.usableModes || def.usableModes.includes("event_item_full") || def.usableModes.includes("explore");
    html += buildItemRowHTML(item, i, {
      showNumber: false,
      useEnabled: modeUsable,
      useHandler: `useFromFull(${i})`,
      discardEnabled: true,
      discardHandler: `dropAndKeep(${i})`,
      newBadge: isNew,
    });
  });
  container.innerHTML = html;
  a.appendChild(container);
}

// 満タン時に「使う」を押したときの処理
//  - 既存スロットのアイテムを使う → そこに空きができる → pendingItem を空きへ入れる
//  - 新規アイテム(pendingItem)自身を使う → 持ち物は5個のまま、pendingItemを消費
function useFromFull(index){
  const allItems = [...state.items, state.pendingItem];
  const target = allItems[index];
  if(!target) return;

  const isNew = (index === allItems.length - 1);

  // 効果を発動（既存の useItem の中身に相当する処理を直接呼ぶ）
  applyItemEffect(target);

  if(isNew){
    // 新規アイテムを直接使った：pendingItem を消費して終了
    state.pendingItem = null;
  } else {
    // 既存スロットを消費 → そこに pendingItem を入れる
    state.items.splice(index, 1);
    state.items.push(state.pendingItem);
    state.pendingItem = null;
  }
  saveAll();
  state.mode = "explore";
  render();
}

// 既存のアイテム効果発動ロジックを切り出した関数
// （useItem からも useFromFull からも使えるようにする）
function applyItemEffect(item){
  const def = ITEM_DEF[item.effect];
  if(!def) return;
  if(item.effect === "hp3"){
    let v = getPotionHealValue();
    if(state.relics.some(r => r.id === "potion_boost")){
      v = Math.ceil(v * 1.1);
    }
    heal(v);
    playSE("heal");
    state.runStats.potions++;
    addLog(`ポーションを使った！ HP +${v}`, "scrap");
  } else if(item.effect === "antidote"){
    let idx = state.buffs.findIndex(b => b.id === "poison");
    if(idx >= 0){
      state.buffs.splice(idx, 1);
      playSE("heal");
      addLog("毒消し草を使った！ 毒が治った", "heal");
    } else {
      addLog("毒消し草を使った（毒状態ではなかった）", "normal");
    }
  } else if(item.effect === "guard3"){
    applyBuffById("guard", 3);
    playSE("select");
    addLog("ヘルメットを装着！ 🛡️ ガード +3回", "sub");
  }
}

function dropAndKeep(dropIndex){
  // 引数 allItems を取らない形に変更（呼び出し側がHTML属性経由で渡せないため）
  const allItems = [...state.items, state.pendingItem];
  // 捨てたアイテムを除いた5個を装備
  let kept = allItems.filter((_, i) => i !== dropIndex);
  state.items = kept;
  state.pendingItem = null;
  saveAll();
  let dropped = allItems[dropIndex];
  addLog(`${dropped.name} を捨てた`, "sub");
  state.mode = "explore";
  render();
}

// --- コウモリイベント ---
function calcBatLost(){
  if(state.scrap <= 0) return 0;
  let cap = calcScrap() * 3;
  return Math.min(cap, Math.max(1, Math.floor(state.scrap * 0.1)));
}

function renderBatEvent(){
  let a = document.getElementById("actions");
  let lost = calcBatLost();

  // 「音を立てて気をそらす」ボタン
  let distractBtn = document.createElement("button");
  distractBtn.innerHTML = `音を立てて気をそらす<br><span style="font-size:22px;color:#ffcc66;">スクラップ -${lost}</span>`;
  let riskS = BTN_STYLES.risk;
  let skipS = BTN_STYLES.skip;
  if(state.scrap <= 0){
    distractBtn.style.borderColor = skipS.color;
    distractBtn.style.color       = skipS.color;
    distractBtn.style.background  = skipS.bg;
    distractBtn.disabled = true;
    distractBtn.style.opacity = "0.4";
  } else {
    distractBtn.style.borderColor = riskS.color;
    distractBtn.style.color       = riskS.color;
    distractBtn.style.background  = riskS.bg;
    distractBtn.style.boxShadow   = `0 0 10px ${riskS.color}66`;
    distractBtn.onclick = batDistract;
  }
  a.appendChild(distractBtn);

  // 「無理やり通る」ボタン（danger）
  let forceBtn = document.createElement("button");
  forceBtn.innerText = "無理やり通る";
  let dangerS = BTN_STYLES.danger;
  forceBtn.style.borderColor = dangerS.color;
  forceBtn.style.color       = dangerS.color;
  forceBtn.style.background  = dangerS.bg;
  forceBtn.style.boxShadow   = `0 0 10px ${dangerS.color}66`;
  forceBtn.onclick = batForce;
  a.appendChild(forceBtn);
}

function batDistract(){
  let lost = calcBatLost();
  state.scrap = Math.max(0, state.scrap - lost);
  state.runStats.batScrap += lost;
  addLog(`スクラップ ${lost.toLocaleString()} を投げて気をそらした`, "sub");
  state.mode = "explore";
  render();
}

function batForce(){
  if(Math.random() < 0.40){
    addLog("うまく切り抜けられた！", "sub");
  } else {
    let d = Math.ceil(state.maxHp * 0.1);
    let actual = damage(d);
    playSE("damage");
    applyPoison(3);

// --- 鉱脈イベント ---
const VEIN_PARAMS = [
  { collapse:0.20, mult:1.5, dmgCoef:1  },
  { collapse:0.40, mult:2.5, dmgCoef:2  },
  { collapse:0.60, mult:4.0, dmgCoef:4  },
  { collapse:0.80, mult:6.0, dmgCoef:6  },
];

function renderVeinEvent(){
  let depth = state.veinDepth;
  if(depth === 0){
    btn("掘る", digVein, "risk", null);
  } else {
    let label = depth < 4 ? "もう1回掘る" : null;
    if(label) btn(label, digVein, "risk", null);
    btn("やめる", leaveVein, "skip");
  }
}

function digVein(){
  let depth = state.veinDepth;
  let p = VEIN_PARAMS[Math.min(depth, 3)];
  let collapseRate = p.collapse;
  // 巧掘の紋：崩落確率を20/30/40/50%に固定
  if(state.relics.some(r => r.id === "skilldig")){
    collapseRate = [0.20, 0.30, 0.40, 0.50][Math.min(depth, 3)];
  }

  if(Math.random() < collapseRate){
    // 崩落
    let tier = Math.floor((state.floor - 1) / 10) + 1;
    let d = tier * p.dmgCoef;
    let actual = damage(d);
    playSE("damage");
    state.veinLastEmerald = false;
    addLog(`地盤が崩れた！ ${actual} ダメージ`, "sub");
    checkDeath();
    if(state.mode !== "dead") state.mode = "explore";
  } else {
    // 成功（前回獲得量以上を保証）
    let g = Math.max(state.veinLastGain, Math.floor(calcScrap() * getMiningMultiplier() * p.mult));
    state.scrap += g;
    state.veinLastGain = g;
    // エメラルドドロップ判定（1回目=depth0は0%、2回目以降は倍率適用）
    const veinEmeraldMult = [0, 1.0, 1.5, 2.0];
    let baseRate = getEmeraldDropRate();
    let emeraldRate = baseRate * (veinEmeraldMult[Math.min(state.veinDepth, 3)]);
    let gotEmerald = emeraldRate > 0 && Math.random() < emeraldRate;
    state.veinLastEmerald = gotEmerald;
    if(gotEmerald){
      state.emerald++;
      state.runStats.emerald++;
      playSE("emerald");
      addLog(`鉱脈を掘り当てた！ スクラップ +${g.toLocaleString()} エメラルド +1`, "sub");
    } else {
      playSE("dig");
      addLog(`鉱脈を掘り当てた！ スクラップ +${g.toLocaleString()}`, "sub");
    }
    state.veinDepth++;
    // 4回目終了 or 続行
    if(state.veinDepth >= 4){
      state.runStats.veinClears++;
      addLog("この鉱脈を掘りつくした！", "sub");
      state.mode = "explore";
    }
    // 4回未満なら event_vein のまま→renderVeinEventがボタンを描画
  }
  render();
}

function leaveVein(){
  addLog("鉱脈から引き上げた", "sub");
  state.veinLastGain = 0;
  state.veinLastEmerald = false;
  state.mode = "explore";
  render();
}

function eatMushroom(){
  state.runStats.mushrooms++;
  state.mushroomBad = false;  // 毎回リセット
  let r = Math.random();
  let isBad = false;
  if(r < 0.40){
    // 毒 40%
    isBad = true;
    applyPoison(1);
    addLog("苦い！ 毒を受けた（1ターン）", "sub");
  } else if(r < 0.80){
    // 回復 40%
    let h = 3 + floorHealBonus();
    heal(h);
    playSE("heal");
    addLog(`甘い香り… HP +${h} 回復した`, "sub");
  } else if(r < 0.90){
    // 採掘力UP 10%
    applyMiningUp(5);
    addLog("不思議な胞子を吸い込んだ… 採掘力UP！（5ターン）", "sub");
  } else if(r < 0.95){
    // 錯乱：階層戻り 5%
    isBad = true;
    let back = Math.min(2, state.floor - 1);
    state.floor -= back;
    addLog(`錯乱した！ ${back}階層戻された`, "sub");
  } else {
    // 錯乱：スクラップ破棄 5%
    isBad = true;
    let lost = Math.floor(state.scrap * 0.1);
    state.scrap = Math.max(0, state.scrap - lost);
    addLog(`錯乱した！ スクラップ ${lost.toLocaleString()} をばらまいた`, "sub");
  }
  state.mushroomBad = isBad;
  checkDeath();
  if(state.mode !== "dead") state.mode = "explore";
  render();
}

// --- 帰還 ---
function confirmReturn(){
  showConfirm("本当に帰還しますか？<br>（スクラップの半分を持ち帰ります）", () => {
    doReturn();
  });
}

function doReturn(){
  let carry = Math.floor(state.scrap / 2);
  state.totalScrap += carry;
  let emeraldCarry = state.emerald;
  state.totalEmerald += emeraldCarry;
  let newBest = state.maxFloorThisRun > state.bestFloor;
  if(newBest) state.bestFloor = state.maxFloorThisRun;
  commitStats(false, carry);
  state.stats.emerald += emeraldCarry;
  if(carry > state.stats.maxScrapCarry) state.stats.maxScrapCarry = carry;
  if(emeraldCarry > state.stats.maxEmeraldCarry) state.stats.maxEmeraldCarry = emeraldCarry;
  saveAll();
  let unlocks = checkUnlocks();
  // 鉄扉：10階ごとに現れる帰還扉。スクラップ半分を支払って帰還する
  state.lastResult = { survived: true, returnType: "door", floor: state.maxFloorThisRun, carry, emeraldCarry, newBest, unlocks, relics: [...state.relics] };
  saveLastResult(state.lastResult);
  state.mode = "result";
  render();
}

function forceReturn(){
  // ★採掘便り：死亡データをCloudflareへ送信（非同期・失敗は無視）
  // 送信する階数は「死亡した階」= state.floor。
  // アイテムは items[0]（消耗品欄1番目）の effect 文字列。なければ null。
  const deathFloor = state.floor;
  const deathScrap = state.scrap;
  const item0 = state.items[0];
  const itemEffect = (item0 && item0.effect) ? item0.effect : null;
  sendDeathToServer(deathFloor, deathScrap, itemEffect);

  let newBest = state.maxFloorThisRun > state.bestFloor;
  if(newBest) state.bestFloor = state.maxFloorThisRun;
  commitStats(true);
  saveAll();
  let unlocks = checkUnlocks();
  state.lastResult = { survived: false, returnType: "death", floor: state.maxFloorThisRun, carry: 0, emeraldCarry: 0, newBest, unlocks, relics: [...state.relics] };
  saveLastResult(state.lastResult);
  state.mode = "result";
  render();
}

  <div class="parchment-header">◆ 前回の採掘 ◆</div>

  <div class="result-badge ${badgeClass}">${badgeLabel}</div>

// 「ジャンプで渡る」ボタン押下
function pitJumpAttempt(){
  // 成功率 = 現在HP / 最大HP
  let chance = state.hp / state.maxHp;
  if(Math.random() < chance){
    // 成功：結果モードへ。floor操作は「採掘する」ボタン押下時に行う
    playSE("select");
    addLog("ジャンプ成功！ 一気に深部へ降り立った", "scrap");
    state.pitJumpResult = { success: true };
    state.mode = "event_pitjump_result";
    render();
  } else {
    // 失敗：暗石と同じダメージ計算
    playSE("damage");
    let base = Math.floor(Math.random()*3) + 1 + floorDmgBonus();
    let d = Math.max(1, Math.floor(base / 2));
    let actual = damage(d);
    addLog(`ジャンプ失敗… 落下して ${actual} ダメージ`, "damage");
    if(state.hp <= 0){
      // 死亡時は damage() 内で death モードに遷移済み
      render();
      return;
    }
    state.pitJumpResult = { success: false, dmg: actual };
    state.mode = "event_pitjump_result";
    render();
  }
}

// ジャンプ結果モードの「採掘する」ボタン押下時：floor操作 + next()
function proceedPitJump(){
  let r = state.pitJumpResult || { success: true };
  if(r.success){
    // 成功：+3階（state.floor += 2、その後 next() の +1 で合計+3）
    state.floor += 2;
    state.runStats.floors += 2; // 実階数派
  } else {
    // 失敗：-1階（state.floor -= 2、その後 next() の +1 で合計-1）
    state.floor -= 2;
    state.runStats.floors -= 2; // 実階数派
    if(state.floor < 0) state.floor = 0; // 念のため負数ガード
  }
  state.pitJumpResult = null;
  state.mode = "explore";
  next();
}

  if(state.items.length >= 5){ showAlert("持ち物がいっぱい"); return; }
  state.totalScrap -= cost;
  state.items.push({ name: "毒消し草", effect: "antidote" });
  playSE("coin");
  saveAll();
  render();
}

function buyHelmet(){
  const cost = 100;
  if(state.totalScrap < cost){ showAlert("スクラップが足りない"); return; }
  if(state.items.length >= 5){ showAlert("持ち物がいっぱい"); return; }
  state.totalScrap -= cost;
  state.items.push({ name: "ヘルメット", effect: "guard3" });
  playSE("coin");
  saveAll();
  render();
}

function buyUnlockHelmet(){
  const cost = 3;
  if(state.unlockedItems.includes("guard3")){ showAlert("すでに解放済み"); return; }
  if(state.totalEmerald < cost){ showAlert("エメラルドが足りない"); return; }
  showConfirm(`エメラルド ${cost} でヘルメットを解放しますか？<br>（消耗品に並ぶようになります）`, () => {
    state.totalEmerald -= cost;
    state.unlockedItems.push("guard3");
    playSE("coin");
    saveAll();
    render();
  });
}

function buyPotionHeal(){
  let cost = getPotionHealCost();
  if(state.totalScrap < cost){ showAlert("スクラップが足りない"); return; }
  let curVal = getPotionHealValue();
  showConfirm(`スクラップ ${cost.toLocaleString()} でポーション回復量を +1 強化しますか？<br>（${curVal} → ${curVal+1}）`, () => {
    state.totalScrap -= cost;
    state.upgrades.potionHeal++;
    playSE("coin");
    saveAll();
    render();
  });
}

function buyHp(){
  let cost = getHpCost();
  if(state.totalScrap < cost){ showAlert("スクラップが足りない"); return; }
  state.totalScrap -= cost;
  state.maxHp++;
  state.hp++;
  state.upgrades.hp++;
  playSE("coin");
  saveAll();
  render();
}

function buyPower(){
  let cost = getPowerCost();
  if(state.totalScrap < cost){ showAlert("スクラップが足りない"); return; }
  state.totalScrap -= cost;
  state.power++;
  state.upgrades.power++;
  playSE("coin");
  saveAll();
  render();
}

render();
// ★採掘便り：起動時にUUIDを確保（無ければ生成・既存ならそのまま）
getPlayerUuid();
showResumeOverlayIfNeeded();
</script>
